<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark light"><title>Informatik · Lernstudio</title><style>
:root{--bg:#101413;--panel:#191f1d;--soft:#232c28;--line:#34433b;--text:#f0f4ec;--muted:#a7b4aa;--accent:#c2f178;--ink:#17250c;--red:#ffad9c;--blue:#b9d9f0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,Segoe UI,sans-serif}body.light{--bg:#f2f4ed;--panel:#fff;--soft:#e8eddf;--line:#ccd5c5;--text:#17241c;--muted:#53634f;--accent:#c2ee79;--red:#a63427;--blue:#265976}button,input,select,textarea{font:inherit}button,a,input,select,textarea{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:default;opacity:.65}button,.btn{border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--text);padding:10px 16px;text-decoration:none;display:inline-block}button:hover:not(:disabled),.btn:hover{border-color:var(--accent)}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.primary{background:var(--accent);color:var(--ink);border-color:var(--accent);font-weight:700}.quiet{background:transparent}header{border-bottom:1px solid var(--line);padding:20px max(20px,calc((100vw - 1200px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:800;letter-spacing:-.8px;font-size:21px}.mark{color:var(--accent);margin-right:10px;font-family:monospace}.light .mark{color:#42681c}.small{font-size:13px;color:var(--muted)}main{max-width:1200px;margin:auto;padding:30px 24px 80px}nav{display:flex;gap:6px;overflow:auto;padding:5px 0 18px;margin-bottom:20px}nav button{white-space:nowrap;border-color:transparent;background:transparent;color:var(--muted)}nav button.active{background:var(--soft);color:var(--text);border-color:var(--line)}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(36px,6vw,64px);line-height:1.08;letter-spacing:-2.6px;max-width:650px;margin-bottom:20px}h2{font-size:28px;letter-spacing:-.8px;line-height:1.25}h3{font-size:19px;line-height:1.35}p{color:var(--muted)}.eyebrow{text-transform:uppercase;letter-spacing:2px;font:12px monospace;color:var(--accent);margin-bottom:17px}.light .eyebrow{color:#42681c}.light h1 span{color:#416b19!important}.hero{display:grid;gap:24px;padding:15px 0 35px}.hero p{max-width:530px}.hero-art{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;display:flex;align-items:center;justify-content:center;min-height:230px;position:relative}.hero-art:before{content:'ABLAUF / 01';position:absolute;top:18px;left:20px;font:11px monospace;color:var(--muted)}.hero-art svg{width:100%;max-width:340px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grid{display:grid;gap:16px}.card{padding:24px;border:1px solid var(--line);border-radius:16px;background:var(--panel);min-width:0}.topic{display:flex;flex-direction:column;align-items:stretch;text-align:left;min-height:190px}.topic .num{font:13px monospace;color:var(--muted);margin-bottom:18px}.topic p{font-size:14px;margin-bottom:18px}.topic .foot{margin-top:auto;display:flex;justify-content:space-between;font-size:13px}.pill{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:50px;padding:4px 10px;font-size:12px;color:var(--muted)}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:22px 0 16px}.sectionhead h2{margin:0}.progress{height:5px;background:var(--soft);border-radius:6px;overflow:hidden;margin:10px 0 24px}.progress span{display:block;height:100%;background:var(--accent);transition:width .3s}.stack>*+*{margin-top:18px}pre{background:var(--bg);padding:20px;border:1px solid var(--line);border-radius:10px;overflow:auto;font:14px/1.7 ui-monospace,Consolas,monospace;color:var(--blue);tab-size:2}code{font-family:ui-monospace,Consolas,monospace}.callout{border-left:3px solid var(--accent);padding:14px 18px;background:var(--soft);border-radius:0 8px 8px 0}.callout p{margin:0;color:var(--text)}.narrow{max-width:850px;margin:auto}.answers{display:grid;gap:12px;margin:25px 0}.answer{text-align:left;display:flex;gap:14px;align-items:center;padding:17px}.answer b{font:12px monospace;color:var(--muted)}.answer.good{border-color:var(--accent);background:#2a4021;color:#eaffdd}.answer.bad{border-color:var(--red);background:#4c2724;color:#ffe8e3}.feedback{margin:16px 0;padding:18px;border:1px solid var(--line);border-radius:12px}.flash{min-height:280px;display:flex;align-items:center;justify-content:center;text-align:center;width:100%;padding:32px;font-size:24px;line-height:1.45;background:var(--panel)}label{display:block;margin:10px 0 5px}select,input[type=text],input[type=number],textarea{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:12px;max-width:100%}select{min-height:46px}textarea{width:100%;min-height:200px;resize:vertical}textarea.editor{font:14px/1.65 ui-monospace,monospace;min-height:260px;tab-size:2}iframe{width:100%;height:240px;background:white;border:1px solid var(--line);border-radius:10px}.exercise{border-top:1px solid var(--line);padding-top:24px;margin-top:24px}.check{display:flex;align-items:start;gap:10px;margin:10px 0;color:var(--muted)}input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px;margin-top:5px;flex-shrink:0}details{border-top:1px solid var(--line);padding:16px 0}summary{cursor:pointer;font-weight:650}details p{margin:12px 0}.diagram{overflow:auto;background:#f8fbf4;border-radius:12px;padding:14px;margin:18px 0;color:#243324}.diagram svg{width:100%;min-width:420px;max-height:600px}.diagram svg text{font:14px system-ui;fill:#243324}.diagram svg rect,.diagram svg polygon,.diagram svg path.box{fill:#edf4e5;stroke:#587745;stroke-width:1.5}.diagram svg .flow{fill:none;stroke:#587745;stroke-width:1.5}.canvas{display:block;width:100%;height:380px;background:#fff;border:1px solid var(--line);border-radius:10px;touch-action:none}.status{color:var(--muted);font-size:13px}.stats{display:flex;gap:30px;margin-bottom:20px}.stats strong{font-size:28px;font-weight:550;display:block;line-height:1.2}.stats span{font-size:12px;color:var(--muted)}.sources{font-size:14px}.sources a{color:var(--blue);overflow-wrap:anywhere}.hidden{display:none!important}.view{animation:arrive .25s ease}@keyframes arrive{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@media(min-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:1.4fr 1fr}.split{display:grid;grid-template-columns:1fr 1fr;gap:22px}}@media(min-width:1050px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:500px){main{padding:20px 16px 60px}.card{padding:19px}.hero-art{display:none}header{padding:16px}.brand{font-size:18px}.sectionhead{align-items:start}.stats{gap:24px}h1{letter-spacing:-1.4px}.flash{font-size:20px}.row>select{width:100%}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media print{header,nav,.no-print{display:none}body{background:white;color:black}.card{break-inside:avoid}p{color:#333}}
</style></head><body><header><div class="brand"><span class="mark">&lt;/&gt;</span>Informatik<span class="small"> / Lernstudio</span></div><button id="theme" class="quiet" aria-label="Farbschema wechseln">Hell</button></header><main><nav aria-label="Hauptnavigation"></nav><div id="app"></div><p class="small" id="saveStatus" style="margin-top:32px">Dein Fortschritt bleibt in diesem Browser. Funktioniert auch offline.</p></main><script>
const DATA={"lessons": [{"title": "Responsive & Grid", "sub": "Ein Seitenraster verstehen.", "text": "Responsive Webdesign passt die Anordnung einer Webseite an die verfügbare Breite an. CSS Grid hilft beim Aufbau: display: grid aktiviert das Raster. grid-template-columns legt Spalten fest, grid-template-rows die Zeilen und grid-template-areas die benannten Bereiche. grid-area ordnet ein HTML-Element einem solchen Bereich zu.", "tip": "px = Pixel; % bezieht sich hier auf den umgebenden Bereich; 1vw = 1 % der Viewportbreite; 1vh = 1 % der Viewporthöhe. fr verteilt freien Platz proportional. Ein Punkt in grid-template-areas steht für eine leere Zelle. Beachte: 50% + 50% plus grid-gap kann die verfügbare Breite überschreiten.", "code": "body {\n  height: 100vh;\n  display: grid;\n  grid-gap: 5px;\n  grid-template-columns: 50% 50%;\n  grid-template-rows: 100px 1fr 1fr 1fr 30px;\n  grid-template-areas:\n    \"header header\"\n    \"nav nav\"\n    \"article aside\"\n    \"section aside\"\n    \"footer footer\";\n}\nheader { grid-area: header; }\nnav { grid-area: nav; }\narticle { grid-area: article; }\nsection { grid-area: section; }\naside { grid-area: aside; }\nfooter { grid-area: footer; }"}, {"title": "Mobile First", "sub": "Kleine Basis, größere Ansichten.", "text": "Mobile First beginnt mit dem kleinen Layout und ergänzt das größere mit einer min-width-Abfrage. Desktop First bedeutet: großes Layout zuerst, anschließend Anpassungen für kleinere Ansichten. Optimieren heißt hier: gemeinsame Regeln einmal in die Basis schreiben und in der Media Query nur Änderungen ergänzen.", "tip": "In Media Queries bezieht sich em auf die anfängliche Schriftgröße des Browsers. Bei 16px sind 44.001em ungefähr 704px. Die Grenze ist also nicht immer eine feste Pixelzahl. Beim Wechsel der Spalten muss auch grid-template-areas passen. Jeder benannte Bereich sollte im jeweiligen Raster sinnvoll zugeordnet sein.", "code": "body {\n  height: 100vh;\n  display: grid;\n  grid-gap: 5px;\n  grid-template-columns: 50% 50%;\n  background-color: #A67458;\n  /* Hier folgt das Raster für die kleine Ansicht. */\n}\n@media screen and (min-width: 44.001em) {\n  body {\n    width: 80vw;\n    margin: auto;\n    grid-gap: 10px;\n    grid-template-columns: 20% 20% 20% 20% 20%;\n    /* Hier folgen die geänderten Zeilen und Bereiche. */\n  }\n}\n/* Gemeinsame Regeln wie display und Hintergrundfarbe\n   müssen oben nicht nochmals wiederholt werden. */"}, {"title": "HTML-Formulare", "sub": "Eingabefelder und Labels verstehen.", "text": "form umschließt das Formular. action nennt die Zieldatei, method=\"post\" die Übertragungsmethode. input kann text, password, radio, checkbox, submit oder reset sein. name benennt das übertragene Feld. size steuert bei Textfeldern die sichtbare Breite, placeholder den Eingabehinweis. textarea verwendet rows und cols; select enthält option-Elemente.", "tip": "Label-Ergänzung: for am label muss zur id des Felds passen. Radio-Buttons einer Gruppe haben denselben name und unterschiedliche value-Werte. Checkboxen erlauben mehrere Auswahlen. reset stellt Anfangswerte wieder her. submit sendet das Formular. Eine Auswahlliste wird mit </select> geschlossen.", "code": "<form action=\"Datei.php\" method=\"post\">\n  <!-- Beschriftung und Textfeld verbinden -->\n  <label for=\"vorname\">Vorname:</label>\n  <input type=\"text\" id=\"vorname\" name=\"Vorname\"\n         size=\"25\" placeholder=\"Hier Vorname eingeben\">\n\n  <label for=\"passwort\">Passwort:</label>\n  <input type=\"password\" id=\"passwort\" name=\"passwort\">\n\n  <label for=\"kommentar\">Kommentar:</label>\n  <textarea id=\"kommentar\" name=\"Kommentar\" rows=\"5\" cols=\"30\"></textarea>\n\n  <label for=\"farbe\">Lieblingsfarbe:</label>\n  <select id=\"farbe\" name=\"lieblingsfarbe\" size=\"1\">\n    <option>Rot</option>\n    <option>Blau</option>\n  </select>\n  <input type=\"submit\" value=\"Datei absenden\">\n  <input type=\"reset\" value=\"Eingaben zurücksetzen\">\n</form>"}, {"title": "Formular-CSS", "sub": "Gestaltung erklären und ergänzen.", "text": "color setzt die Schriftfarbe, background-color den Hintergrund. padding ist der Innenabstand, margin der Außenabstand. border definiert einen Rahmen, border-radius rundet Ecken ab. label mit display: inline-block und width: 100px kann Beschriftungen gleich breit machen. :focus gilt bei einem aktiven Eingabefeld; :hover beim Darüberfahren mit der Maus. transition macht einen Zustandswechsel allmählich.", "tip": "Ein weiterer Selektor ist: input[type=\"radio\"]:checked + label spricht das direkt folgende label eines ausgewählten Radiofelds an. Dafür muss im HTML zuerst der Input und direkt danach das Label stehen. Beim weißen Fokus-Hintergrund setzen wir die Schrift schwarz, damit sie lesbar bleibt.", "code": "label {\n  display: inline-block;\n  width: 100px;\n}\ninput, textarea, select {\n  background-color: #879DDA;\n  color: white;\n  border: 2px solid #6373A0;\n  transition: 0.2s ease;\n}\ninput:focus, textarea:focus, select:focus {\n  background-color: white;\n  color: black;\n}\ninput[type=\"radio\"]:checked + label,\ninput[type=\"checkbox\"]:checked + label {\n  font-weight: 900;\n}\n/* Passende Reihenfolge im HTML: */\n/* <input type=\"radio\" id=\"normal\" name=\"groesse\" value=\"normal\">\n   <label for=\"normal\">Normal</label> */"}, {"title": "Algorithmen", "sub": "Vom Problem zur Schrittfolge.", "text": "Ein Algorithmus beschreibt eine eindeutige Schrittfolge zur Lösung einer Aufgabe. Ein Programm setzt einen solchen Ablauf in einer Programmiersprache um. Eingabe → Verarbeitung → Ausgabe ist ein häufiges Grundschema.", "tip": "Studyflix nennt: Ausführbarkeit (machbare Schritte), Determinismus (eindeutiger nächster Schritt), Determiniertheit (gleiche Eingaben, gleiches Ergebnis), Finitheit (endliche Beschreibung) und Terminierung (Ablauf endet). Finitheit und Terminierung sind verschieden: Eine kurze Endlosschleife endet trotzdem nie.", "code": "Eingabe: a, b\nWenn a > b:\n    Ausgabe a\nSonst:\n    Ausgabe b"}, {"title": "Kontrollstrukturen", "sub": "Reihenfolge, Auswahl, Wiederholung.", "text": "Sequenz: Anweisungen nacheinander. Alternative: je nach Bedingung ein Zweig. Mehrfachauswahl: einer von mehreren Fällen. Zählergesteuerte Schleife: feste Anzahl. Kopfgesteuert: vor dem Durchlauf prüfen, also auch 0 Durchläufe möglich. Fußgesteuert: erst ausführen, dann prüfen, also mindestens 1 Durchlauf.", "tip": "Das Beispiel verwendet bei der fußgesteuerten Schleife „solange Bedingung wahr“. Bei „wiederhole bis“ ist die Logik umgekehrt: Bei wahr wird beendet.", "code": "i = 1\nSolange i <= 3:\n    Ausgabe i\n    i = i + 1\n// Ausgabe: 1, 2, 3"}, {"title": "PAP & Struktogramm", "sub": "Ein Ablauf, zwei Darstellungen.", "text": "Ein PAP verbindet Symbole mit gerichteten Pfeilen. Ein Struktogramm verschachtelt rechteckige Blöcke ohne Ablaufpfeile. Sequenzen liegen untereinander, Zweige nebeneinander und Schleifen umschließen ihren Körper.", "tip": "PAP: abgerundetes Symbol = Start/Ende, Rechteck = Verarbeitung, Raute = Entscheidung, Parallelogramm = Ein-/Ausgabe. Für Schleifen gibt es außerdem gepaarte Schleifenbegrenzungen.", "code": "Beim Zeichnen prüfen:\n1. Alle Anweisungen in der richtigen Reihenfolge?\n2. Bedingungen und Zweige klar beschriftet?\n3. Schleife mit sinnvoller Bedingung und Änderung?\n4. Beide Zweige anschließend richtig zusammengeführt?"}, {"title": "Abläufe verstehen", "sub": "Lesen, prüfen und selbst darstellen.", "text": "Übe an kurzen, vollständig angegebenen Abläufen: Werte verfolgen, Bedingungen prüfen, Ausgaben bestimmen und Fehler finden. Du brauchst dafür keine bestimmte Aufgabe oder Datei auswendig zu kennen.", "tip": "Starte mit den Anfangswerten. Gehe jede Anweisung der Reihe nach durch und notiere Änderungen. Prüfe bei Schleifen nach jedem Durchlauf erneut die Bedingung. Achte besonders auf < und <= sowie auf den Zeitpunkt der Ausgabe.", "code": "x = 1\nSolange x <= 3:\n    Ausgabe x\n    x = x + 1\nAusgabe \"Ende\"\n\nErgebnis: 1, 2, 3, Ende"}], "questions": [{"t": 0, "q": "Was bewirkt display: grid im body?", "a": ["Es aktiviert das Grid-Raster.", "Es sendet ein Formular.", "Es erstellt automatisch Labels.", "Es färbt alle Bereiche blau."], "e": "Die nachfolgenden Grid-Angaben gestalten dieses Raster."}, {"t": 0, "q": "Was legt grid-template-columns: 50% 50% fest?", "a": ["Zwei Spalten mit jeweils 50 % Breite.", "Zwei Zeilen mit 50px Höhe.", "Eine Spalte mit 100px Breite.", "Fünf gleich große Spalten."], "e": "Jeder Wert steht für eine Spalte. Zusätzliche Abstände können bei 100 % Gesamtbreite Überlauf verursachen."}, {"t": 0, "q": "Was bestimmt grid-template-rows?", "a": ["Anzahl und Größen der Zeilen.", "Nur die Schriftgröße.", "Die Namen der Formularfelder.", "Die Farbe der Links."], "e": "150px 1fr 1fr 1fr 50px beschreibt fünf Zeilen."}, {"t": 0, "q": "Wozu dient grid-template-areas?", "a": ["Benannte Bereiche im Raster anzuordnen.", "Felder zu versenden.", "Farben zu mischen.", "Passwörter zu verdecken."], "e": "Jede Zeichenkette steht für eine Rasterzeile."}, {"t": 0, "q": "Was bewirkt header { grid-area: header; }?", "a": ["Es ordnet das header-Element dem Rasterbereich header zu.", "Es erzeugt einen neuen HTML-Header.", "Es legt nur eine Überschrift fest.", "Es macht den Header automatisch 100px hoch."], "e": "grid-area verknüpft das Element mit dem Namen im Raster."}, {"t": 0, "q": "Was bedeutet der Punkt in \". header header\"?", "a": ["Eine leere Rasterzelle.", "Einen Fehler in der CSS-Datei.", "Ein Klassenname namens Punkt.", "Ein Formularfeld."], "e": "Der Punkt reserviert eine unbenannte Zelle."}, {"t": 0, "q": "Was bedeutet height: 100vh?", "a": ["Höhe von 100 % der Viewporthöhe.", "Höhe von 100 Pixeln.", "Breite von 100 % der Seite.", "Höhe von 100 Textzeilen."], "e": "vh steht für viewport height; 1vh entspricht 1 %."}, {"t": 0, "q": "Was bedeutet width: 80vw?", "a": ["80 % der Viewportbreite.", "80 % der Viewporthöhe.", "80 Pixel Breite.", "80 Rasterspalten."], "e": "vw steht für viewport width."}, {"t": 0, "q": "Wofür steht 1fr in den Grid-Zeilen?", "a": ["Ein Anteil am noch verfügbaren Platz.", "Ein Pixel.", "Eine feste Höhe von 100px.", "Ein Prozent der Schriftgröße."], "e": "Gleich große fr-Werte teilen den freien Platz gleich auf."}, {"t": 0, "q": "Was leistet Responsive Webdesign?", "a": ["Es passt die Anordnung an verschiedene Bildschirmbreiten an.", "Es entfernt immer die Navigation.", "Es macht aus HTML eine PHP-Datei.", "Es erlaubt nur Smartphones."], "e": "In deinem Beispiel geschieht das über verschiedene Grid-Raster."}, {"t": 1, "q": "Ein kleines Grundlayout wird durch eine min-width-Abfrage für größere Ansichten erweitert. Welcher Ansatz ist das?", "a": ["Mobile First", "Desktop First", "Ein Layout ohne Media Query", "Ein nicht responsives Layout"], "e": "Die Basis ist die kleine Ansicht; die Mindestbreiten-Abfrage erweitert sie."}, {"t": 1, "q": "Wann gilt min-width: 44.001em?", "a": ["Ab einschließlich 44.001em Viewportbreite.", "Nur unter 44.001em.", "Nur bei exakt 44.001 Pixeln.", "Immer unabhängig von der Breite."], "e": "min-width legt eine Mindestbreite fest."}, {"t": 1, "q": "Was kann beim Optimieren aus der Media Query entfernt werden, wenn es schon identisch in der Basis steht?", "a": ["display: grid.", "Eine nur dort geänderte Spaltenanzahl.", "Eine nur dort größere Zeilenhöhe.", "Das dort geänderte Raster."], "e": "Gemeinsame Regeln gelten weiter und müssen nicht wiederholt werden."}, {"t": 1, "q": "Was muss beim Wechsel von zwei zu fünf Spalten ebenfalls überprüft werden?", "a": ["Die Anordnung in grid-template-areas.", "Der Text des Submit-Buttons.", "Der Formularname.", "Die HTML-Sprache."], "e": "Die Anzahl der Rasterzellen pro Zeile muss zum gewünschten Aufbau passen."}, {"t": 1, "q": "Wie viele Spalten hat 20% 20% 20% 20% 20%?", "a": ["Fünf", "Vier", "Zwei", "Zwanzig"], "e": "Jeder der fünf Werte beschreibt eine Spalte."}, {"t": 4, "q": "Was ist ein Algorithmus?", "a": ["Eine eindeutige Schrittfolge zur Lösung einer Aufgabe.", "Nur ein fertiges Computerprogramm.", "Immer eine mathematische Formel.", "Jede beliebige Liste ohne Reihenfolge."], "e": "Die Beschreibung kann auch ohne konkrete Programmiersprache erfolgen."}, {"t": 4, "q": "Was unterscheidet Determinismus von Determiniertheit?", "a": ["Eindeutiger Folgeschritt gegenüber gleichem Ergebnis bei gleichen Eingaben.", "Beides bedeutet ausschließlich: schnell.", "Determinismus betrifft Farben, Determiniertheit Formen.", "Beides bedeutet: unendlich viele Schritte."], "e": "Ablauf und Ergebnis sind zwei unterschiedliche Aspekte."}, {"t": 4, "q": "Eine kurze Endlosschleife: Was fehlt?", "a": ["Terminierung.", "Eine endliche Beschreibung.", "Zwingend die Ausführbarkeit.", "Zwingend jede eindeutige Anweisung."], "e": "Die Beschreibung kann endlich sein, während die Ausführung niemals aufhört."}, {"t": 4, "q": "„Sortiere diese Liste irgendwie“ ist problematisch, weil …", "a": ["die konkreten Schritte nicht eindeutig festgelegt sind.", "Listen nie sortiert werden können.", "Algorithmen nur Zahlen addieren.", "eine Ausgabe verboten ist."], "e": "Ein nachvollziehbarer Ablauf braucht präzise Anweisungen."}, {"t": 5, "q": "Welche Schleife kann ihren Körper komplett überspringen?", "a": ["Kopfgesteuerte Schleife.", "Fußgesteuerte Schleife.", "Jede Schleife läuft immer einmal.", "Keine Schleife."], "e": "Ist die Bedingung schon am Anfang falsch, gibt es keinen Durchlauf."}, {"t": 5, "q": "Welche Schleife läuft mindestens einmal?", "a": ["Fußgesteuerte Schleife.", "Kopfgesteuerte Schleife.", "Eine Schleife mit 0 Wiederholungen.", "Eine Alternative."], "e": "Die Bedingung wird erst nach dem Körper geprüft."}, {"t": 5, "q": "i=1; solange i<=3: Ausgabe i; i=i+1. Was erscheint?", "a": ["1, 2, 3", "1, 2", "0, 1, 2", "2, 3, 4"], "e": "Prüfen vor der Ausgabe; nach Ausgabe 3 wird i=4 und die Bedingung falsch."}, {"t": 5, "q": "Was ist eine Sequenz?", "a": ["Mehrere Anweisungen werden nacheinander ausgeführt.", "Eine Auswahl zwischen zwei Fällen.", "Eine Wiederholung ohne Ende.", "Eine Zufallszahl."], "e": "Die Reihenfolge ist vorgegeben, ohne Verzweigung."}, {"t": 6, "q": "Welche PAP-Form steht für eine Entscheidung?", "a": ["Raute", "Rechteck", "Abgerundetes Startsymbol", "Pfeil"], "e": "Die ausgehenden Wege müssen eindeutig bezeichnet sein, z. B. Ja und Nein."}, {"t": 6, "q": "Was ist typisch für ein Struktogramm?", "a": ["Verschachtelte Blöcke ohne Ablaufpfeile.", "Nur Kreise mit Pfeilen.", "Ausschließlich Programmcode.", "Frei verteilte Symbole ohne Struktur."], "e": "Die räumliche Anordnung zeigt den Ablauf und die Verschachtelung."}, {"t": 6, "q": "Wofür steht das Rechteck im PAP?", "a": ["Verarbeitung bzw. Anweisung.", "Nur Start.", "Immer eine Entscheidung.", "Immer eine Ein-/Ausgabe."], "e": "Beispiel: summe = summe + zahl."}, {"t": 6, "q": "Was müssen die zwei Ausgänge einer Bedingung deutlich machen?", "a": ["Welcher Weg bei wahr bzw. falsch gilt.", "Welche Farbe der Nutzer mag.", "Welche Datei größer ist.", "Dass beide Zweige immer laufen."], "e": "Genau der zur Bedingung passende Zweig wird ausgeführt."}, {"t": 7, "q": "x=4; wenn x>0: Ausgabe „positiv“, sonst: Ausgabe „nicht positiv“. Was erscheint?", "a": ["positiv", "nicht positiv", "Beide Ausgaben", "Keine Ausgabe"], "e": "4>0 ist wahr, deshalb wird nur der erste Zweig ausgeführt."}, {"t": 7, "q": "Wo steht eine Anweisung, die erst nach allen Schleifendurchläufen ausgeführt werden soll?", "a": ["Hinter der Schleife.", "Am Anfang des Schleifenkörpers.", "Immer innerhalb der Bedingung.", "Vor der Initialisierung."], "e": "Eine Anweisung hinter der Schleife wird nach deren Ende ausgeführt."}, {"t": 7, "q": "Wenn x>0 gilt, wird zusätzlich x>10 geprüft. Welche Struktur liegt vor?", "a": ["Eine verschachtelte Alternative.", "Nur eine Sequenz ohne Auswahl.", "Eine feste Wiederholung.", "Eine Eingabe ohne Verarbeitung."], "e": "Eine weitere Bedingung steht innerhalb eines Zweigs."}, {"t": 7, "q": "x=3; y=x+2; x=y*2. Welchen Wert hat x am Ende?", "a": ["10", "3", "5", "8"], "e": "Zuerst wird y=5, danach x=5·2=10."}, {"t": 7, "q": "Warum muss sich bei vielen Schleifen ein Wert innerhalb des Körpers ändern?", "a": ["Damit die Wiederholungsbedingung irgendwann falsch werden kann.", "Damit alle Variablen gelöscht werden.", "Damit jeder Zweig gleichzeitig ausgeführt wird.", "Damit keine Prüfung mehr nötig ist."], "e": "Bleibt eine wahre Bedingung unverändert, kann eine Endlosschleife entstehen."}, {"t": 1, "q": "Was bewirkt margin: auto zusammen mit width: 80vw im Beispiel?", "a": ["Der body wird horizontal zentriert.", "Die Schrift wird zentriert.", "Alle Felder werden gesendet.", "Der body wird automatisch vertikal zentriert."], "e": "Die freien Außenabstände links und rechts verteilen sich gleich."}, {"t": 1, "q": "Welche Aussage zu Desktop First stimmt?", "a": ["Man beginnt mit dem großen Layout und passt für kleinere Ansichten an.", "Man darf kein Grid verwenden.", "Man braucht zwei verschiedene HTML-Dateien.", "Die Seite funktioniert nur am Desktop."], "e": "Das ist die umgekehrte Entwurfsrichtung zu Mobile First."}, {"t": 1, "q": "Was ändert grid-gap: 5px zu grid-gap: 10px?", "a": ["Die Zwischenräume im Raster werden größer.", "Die Schrift wird doppelt so groß.", "Die Spaltenanzahl verdoppelt sich.", "Die Höhe wird 10vh."], "e": "grid-gap legt Abstände zwischen Rasterzeilen und Rasterspalten fest."}, {"t": 1, "q": "44.001em entsprechen bei einer anfänglichen Schriftgröße von 16px ungefähr …", "a": ["704px", "44px", "1600px", "2750px"], "e": "44.001 mal 16 sind ungefähr 704. Die Umrechnung hängt von der anfänglichen Schriftgröße ab."}, {"t": 2, "q": "Was legt action=\"Datei.php\" fest?", "a": ["Die Zieldatei der Formularübermittlung.", "Den angezeigten Formulartitel.", "Die Schriftart.", "Die Feldbreite."], "e": "Die Formulardaten werden an dieses Ziel geschickt."}, {"t": 2, "q": "Was legt method=\"post\" fest?", "a": ["Die Methode der Formularübertragung.", "Das Passwort.", "Die Textfarbe.", "Die Sortierung der Felder."], "e": "POST ist die hier verwendete HTTP-Methode."}, {"t": 2, "q": "Wofür ist name=\"Vorname\" im input da?", "a": ["Es benennt das Feld bei der Übermittlung.", "Es zeigt automatisch eine Beschriftung an.", "Es stellt die Feldbreite ein.", "Es verdeckt die Zeichen."], "e": "name ist der Schlüssel des übertragenen Feldwerts."}, {"t": 2, "q": "Wie verbindet man ein Label mit einem Eingabefeld?", "a": ["for am Label entspricht id am Feld.", "for entspricht immer type.", "Beide benötigen dieselbe Farbe.", "Das Label bekommt action."], "e": "Beispiel: label for=\"vorname\" und input id=\"vorname\"."}, {"t": 2, "q": "Was macht type=\"password\"?", "a": ["Es verdeckt die Zeichen bei der Eingabe.", "Es verschlüsselt automatisch die gesamte Übertragung.", "Es verbietet alle Zahlen.", "Es erzeugt einen Absende-Button."], "e": "Die verdeckte Darstellung allein ist keine Verschlüsselung."}, {"t": 2, "q": "Was bedeutet size=\"25\" bei einem Textfeld?", "a": ["Eine sichtbare Breite von ungefähr 25 Zeichen.", "Höchstens 25 Zeichen sind erlaubt.", "25 Zeilen Höhe.", "25px Rahmenbreite."], "e": "size steuert die sichtbare Breite, nicht die maximal erlaubte Textlänge."}, {"t": 2, "q": "Was bewirkt placeholder?", "a": ["Es zeigt einen Hinweis im leeren Eingabefeld.", "Es sendet einen festen Wert.", "Es ersetzt den Feldnamen.", "Es macht das Feld zum Pflichtfeld."], "e": "Der Hinweis verschwindet bei einer Eingabe und ersetzt kein Label."}, {"t": 2, "q": "Wozu dienen rows und cols bei textarea?", "a": ["Zur sichtbaren Zeilenanzahl und ungefähren Zeichenbreite.", "Zur maximalen Zahl der Formulare.", "Zum Verschlüsseln.", "Zum Gruppieren von Radiofeldern."], "e": "rows=\"5\" cols=\"30\" beschreibt die sichtbare Größe."}, {"t": 2, "q": "Wie gehören Radio-Buttons zu einer Gruppe?", "a": ["Sie haben denselben name.", "Sie haben zwingend dieselbe id.", "Sie stehen in verschiedenen Formularen.", "Sie müssen denselben value haben."], "e": "Ein gemeinsamer name verbindet die Optionen; unterschiedliche value-Werte unterscheiden die Auswahl."}, {"t": 2, "q": "Welche Felder erlauben mehrere unabhängige Auswahlen?", "a": ["Checkboxen", "Radio-Buttons derselben Gruppe", "Submit-Buttons", "Labels"], "e": "Mehrere Checkboxen können gleichzeitig ausgewählt sein."}, {"t": 2, "q": "Welches Tag fehlt hier am Ende: <select name=\"farbe\"><option>Rot</option> … ?", "a": ["</select>", "</input>", "</radio>", "</optionlist>"], "e": "Die Auswahlliste muss vor dem folgenden Absatz geschlossen werden."}, {"t": 2, "q": "Was macht input type=\"reset\"?", "a": ["Es stellt die ursprünglichen Formularwerte wieder her.", "Es sendet das Formular.", "Es löscht die HTML-Datei.", "Es schließt den Browser."], "e": "Reset bedeutet nicht zwingend, dass alle Felder leer werden."}, {"t": 2, "q": "Was bestimmt value bei input type=\"submit\"?", "a": ["Den sichtbaren Text des Absende-Buttons.", "Die CSS-Höhe.", "Die Zieldatei.", "Die Übertragungsmethode."], "e": "value=\"Datei absenden\" beschriftet den Button."}, {"t": 2, "q": "Welche Zeile bindet eine externe CSS-Datei ein?", "a": ["<link rel=\"stylesheet\" href=\"style.css\">", "<style src=\"style.css\">", "<css href=\"style.css\">", "<input type=\"style.css\">"], "e": "link im head verbindet das HTML mit der externen CSS-Datei."}, {"t": 3, "q": "Was verändert color: white?", "a": ["Die Schriftfarbe.", "Die Hintergrundfarbe.", "Die Spaltenbreite.", "Die Formularmethode."], "e": "background-color wäre für den Hintergrund zuständig."}, {"t": 3, "q": "Was ist padding: 20px beim Formular?", "a": ["Ein Innenabstand von 20px.", "Ein Außenabstand von 20px.", "Eine Textlänge von 20 Zeichen.", "Eine Zeilenhöhe von 20vh."], "e": "Padding schafft Platz zwischen Inhalt und Rand."}, {"t": 3, "q": "Was bewirkt border-radius: 10px?", "a": ["Abgerundete Ecken.", "Zehn Formularfelder.", "Eine runde Schriftart.", "Eine 10px dicke Umrandung."], "e": "Die Rahmendicke wird über border festgelegt."}, {"t": 3, "q": "Was bedeutet border: 2px solid #6373A0?", "a": ["Ein 2px breiter durchgezogener Rahmen in dieser Farbe.", "Ein gestrichelter Rahmen von 6373px.", "Ein Innenabstand von 2px.", "Eine Schriftgröße von 2px."], "e": "Die Werte nennen Breite, Linienart und Farbe."}, {"t": 3, "q": "Wozu dient label { display: inline-block; width: 100px; }?", "a": ["Labels können in der Zeile stehen und eine feste Breite erhalten.", "Alle Labels werden versteckt.", "Die Labels werden zu Textfeldern.", "Jedes Label sendet Daten."], "e": "So können Beschriftungen gleich breit angeordnet werden."}, {"t": 3, "q": "Wann gilt input:focus?", "a": ["Wenn das Eingabefeld den Fokus besitzt, etwa nach Anklicken.", "Wenn das Feld automatisch gesendet wurde.", "Nur beim Drucken.", "Nur bei einem leeren name."], "e": "Auch per Tastatur kann ein Feld den Fokus erhalten."}, {"t": 3, "q": "Wann gilt li a:hover?", "a": ["Wenn die Maus über einem entsprechenden Link steht.", "Wenn das Formular abgeschickt wurde.", "Wenn die CSS-Datei fehlt.", "Nur nach einem Reset."], "e": "hover beschreibt den Zustand beim Darüberfahren mit der Maus."}, {"t": 3, "q": "Was bewirkt transition: 0.2s ease bei einem passenden Farbwechsel?", "a": ["Der Wechsel erfolgt allmählich über 0,2 Sekunden.", "Die Eingabe wird 2 Sekunden gesperrt.", "Die Farbe wechselt alle 20 Sekunden.", "Die Seite lädt erst nach 2 Minuten."], "e": "transition gestaltet den Übergang zwischen Zuständen."}, {"t": 3, "q": "Was wählt input[type=\"radio\"]:checked + label aus?", "a": ["Das direkt folgende Label eines ausgewählten Radiofelds.", "Alle Labels vor jedem Input.", "Nur nicht ausgewählte Textfelder.", "Das komplette Formular."], "e": ":checked prüft die Auswahl; + verweist auf das direkt folgende Geschwisterelement."}, {"t": 3, "q": "Was macht list-style-type: none bei ul?", "a": ["Es entfernt die Aufzählungszeichen.", "Es löscht alle Links.", "Es setzt die Schriftgröße auf 0.", "Es erzeugt eine nummerierte Liste."], "e": "Die Listeneinträge bleiben bestehen."}, {"t": 3, "q": "Was bewirkt text-decoration: none bei einem Link?", "a": ["Es entfernt die normale Unterstreichung.", "Es entfernt den Linktext.", "Es verhindert jeden Klick.", "Es färbt den Link rot."], "e": "Der Link bleibt weiter anklickbar."}, {"t": 3, "q": "Was spricht div.unten an?", "a": ["div-Elemente mit der Klasse unten.", "Alle Elemente mit id=\"unten\".", "Alle footer-Elemente.", "Die letzte Zeile jeder Tabelle."], "e": "Der Punkt kennzeichnet im Selektor eine Klasse."}, {"t": 2, "q": "Wie schreibt man einen HTML-Kommentar?", "a": ["<!-- Erklärung -->", "/* Erklärung */", "// Erklärung", "<kommentar>Erklärung</kommentar>"], "e": "HTML nutzt <!-- ... -->; in CSS steht ein Kommentar zwischen /* und */."}, {"t": 3, "q": "Was bedeutet input, textarea, select als CSS-Selektor?", "a": ["Die Regel gilt für alle drei genannten Elementtypen.", "Nur select innerhalb von textarea wird angesprochen.", "Nur das erste input wird angesprochen.", "Es wird eine neue HTML-Auswahlliste erzeugt."], "e": "Das Komma fasst mehrere Selektoren zu einer gemeinsamen Regel zusammen."}, {"t": 4, "q": "Welche Eigenschaft betrifft die Durchführbarkeit einzelner Schritte?", "a": ["Ausführbarkeit", "Determinismus", "Terminierung", "Determiniertheit"], "e": "Jeder verlangte Schritt muss tatsächlich ausführbar sein."}, {"t": 4, "q": "Was meint Finitheit hier?", "a": ["Die Beschreibung umfasst endlich viele Anweisungen.", "Jede Ausführung dauert genau eine Sekunde.", "Es gibt keine Wiederholungen.", "Jede Eingabe ist eine Zahl."], "e": "Eine endliche Beschreibung kann eine Schleife enthalten."}, {"t": 4, "q": "Was ist ein Programm im Verhältnis zum Algorithmus?", "a": ["Eine Umsetzung in einer Programmiersprache.", "Immer dieselbe Sache wie ein Struktogramm.", "Eine beliebige Sammlung von Bildern.", "Nur die Ausgabe des Algorithmus."], "e": "Ein Ablauf lässt sich in verschiedenen Sprachen umsetzen."}, {"t": 4, "q": "Was ist beim Durchschnittsalgorithmus die Verarbeitung?", "a": ["Summe bilden und durch die Anzahl teilen.", "Nur Zahlen eingeben.", "Nur das Ergebnis anzeigen.", "Nur den Programmnamen wählen."], "e": "Eingabe, Berechnung und Ausgabe haben unterschiedliche Aufgaben."}, {"t": 4, "q": "Wann endet die Schleife „solange x > 0“ mit x=x-1, Start x=3?", "a": ["Nachdem x auf 0 verringert wurde.", "Erst bei x=-1.", "Schon vor der ersten Ausführung.", "Sie endet niemals."], "e": "Bei x=0 ist x>0 falsch."}, {"t": 4, "q": "Welche Anweisung ist am eindeutigsten?", "a": ["Erhöhe x um 1.", "Mach x etwas größer.", "Verbessere x irgendwie.", "Verändere etwas."], "e": "Eine feste Rechenoperation ist eindeutig ausführbar."}, {"t": 4, "q": "Warum kann man einen Algorithmus als Diagramm darstellen?", "a": ["Der Ablauf ist unabhängig von einer konkreten Programmiersprache.", "Weil Diagramme automatisch Maschinenprogramme sind.", "Weil damit keine Bedingungen mehr nötig sind.", "Weil alle Diagramme dasselbe Ergebnis liefern."], "e": "Die Darstellung beschreibt die Logik."}, {"t": 4, "q": "Ein Verfahren liefert für identische Eingaben verschiedene Ergebnisse. Welche Eigenschaft fehlt?", "a": ["Determiniertheit", "Zwingend die Finitheit", "Zwingend die Ausführbarkeit", "Zwingend die Terminierung"], "e": "Determiniertheit bezieht sich auf die Übereinstimmung des Ergebnisses."}, {"t": 5, "q": "x=5; solange x<3: x=x+1. Welchen Wert hat x danach?", "a": ["5", "6", "3", "0"], "e": "Die Bedingung ist sofort falsch, der Körper läuft nicht."}, {"t": 5, "q": "x=5; wiederhole x=x+1, solange x<3. Welchen Wert hat x danach?", "a": ["6", "5", "3", "0"], "e": "Die fußgesteuerte Schleife führt den Körper einmal aus."}, {"t": 5, "q": "summe=0; addiere nacheinander 1, 2 und 3. Ergebnis?", "a": ["6", "3", "5", "123"], "e": "0+1+2+3 ergibt 6."}, {"t": 5, "q": "Welche Struktur passt zur Auswahl eines von vier möglichen Fällen?", "a": ["Mehrfachauswahl", "Nur Sequenz", "Zwingend eine Endlosschleife", "Nur ein Funktionsaufruf ohne Auswahl"], "e": "Es gibt mehrere mögliche Fälle."}, {"t": 5, "q": "Bei „wiederhole bis korrekt“ wird beendet, wenn …", "a": ["korrekt wahr ist.", "korrekt falsch ist.", "immer genau zwei Durchläufe erfolgt sind.", "die Schleife noch nicht begonnen hat."], "e": "Die bis-Bedingung ist eine Abbruchbedingung."}, {"t": 5, "q": "Welche Schleife passt zu „genau zehnmal ausführen“?", "a": ["Zählergesteuerte Schleife", "Nur eine Alternative", "Unbegrenzte Wiederholung", "Eine Sequenz mit einer Anweisung"], "e": "Die Wiederholungszahl ist bekannt."}, {"t": 5, "q": "Was ist eine verschachtelte Alternative?", "a": ["Eine Fallunterscheidung innerhalb eines Zweigs einer anderen.", "Zwei beliebige Ausgaben untereinander.", "Eine Schleife ohne Körper.", "Eine Alternative ohne Bedingung."], "e": "Beispiel: Nur wenn x positiv ist, wird zusätzlich geprüft, ob x größer als 10 ist."}, {"t": 5, "q": "i=0; solange i<3: i=i+1; Ausgabe i. Was erscheint?", "a": ["1, 2, 3", "0, 1, 2", "0, 1, 2, 3", "Nur 3"], "e": "Hier wird zuerst erhöht, danach ausgegeben."}, {"t": 6, "q": "Welches PAP-Symbol passt zur Eingabe einer Zahl?", "a": ["Parallelogramm", "Raute", "Abgerundetes Endsymbol", "Verbindungspfeil"], "e": "Das Parallelogramm kennzeichnet Ein- und Ausgaben."}, {"t": 6, "q": "Was zeigen Pfeile im PAP?", "a": ["Die Richtung des Ablaufs.", "Immer Datenbankbeziehungen.", "Die Größe einer Zahl.", "Die Anzahl der Variablen."], "e": "Sie verbinden die Verarbeitungsschritte in der richtigen Reihenfolge."}, {"t": 6, "q": "Wo stehen aufeinanderfolgende Anweisungen im Struktogramm?", "a": ["Untereinander", "Immer nebeneinander", "Außerhalb aller Blöcke", "In Kreisen"], "e": "Von oben nach unten wird die Sequenz gelesen."}, {"t": 6, "q": "Wie erkennt man den Schleifenkörper im Struktogramm?", "a": ["Er ist vom Schleifenblock umschlossen.", "Er ist immer rot.", "Er liegt außerhalb des Diagramms.", "Er braucht einen Rückpfeil."], "e": "Die Verschachtelung stellt die Zugehörigkeit dar."}, {"t": 6, "q": "Warum sollten Ja und Nein an PAP-Zweigen stehen?", "a": ["Damit die Auswahlwege eindeutig sind.", "Damit zwei Zweige gleichzeitig ausgeführt werden.", "Damit keine Bedingung mehr nötig ist.", "Damit die Datei kleiner wird."], "e": "Die Beschriftung ordnet die Wege dem Bedingungsergebnis zu."}, {"t": 6, "q": "Was folgt nach einer Alternative, wenn beide Zweige fertig sind?", "a": ["Der gemeinsame weitere Ablauf.", "Immer automatisch Programmende.", "Immer der andere Zweig.", "Immer eine neue Eingabe."], "e": "Die Zweige werden zum folgenden Schritt zusammengeführt."}, {"t": 6, "q": "Welches Symbol ist für Start/Ende typisch?", "a": ["Ein abgerundetes Symbol", "Eine Entscheidungsraute", "Eine Kommentarzeile", "Ein offener Pfeil ohne Ziel"], "e": "Start und Ende begrenzen den Ablauf."}, {"t": 6, "q": "Was bedeutet Top-down-Entwurf?", "a": ["Eine Gesamtaufgabe schrittweise in kleinere Teilaufgaben zerlegen.", "Zuerst Farben und dann Inhalte festlegen.", "Zufällig mit einem Detail beginnen.", "Den Algorithmus rückwärts ausführen."], "e": "Man verfeinert vom allgemeinen Problem bis zu konkreten Schritten."}, {"t": 7, "q": "x=2; wenn x<5: x=x+3; danach Ausgabe x. Was erscheint?", "a": ["5", "2", "3", "7"], "e": "2<5 ist wahr. Daher wird x auf 5 erhöht."}, {"t": 7, "q": "x=7; solange x<3: Ausgabe x. Wie oft wird ausgegeben?", "a": ["0-mal", "1-mal", "3-mal", "7-mal"], "e": "Die Kopfbedingung ist schon zu Beginn falsch."}, {"t": 7, "q": "Wie prüfst du die Grenze der Bedingung x<=10 sinnvoll?", "a": ["Mit x=9, x=10 und x=11.", "Nur mit x=0.", "Nur mit negativen Zahlen.", "Ohne Werte einzusetzen."], "e": "Werte unterhalb, auf und oberhalb der Grenze decken typische Vergleichsfehler auf."}, {"t": 7, "q": "x=3; solange x>=1: Ausgabe x; x=x-1. Was erscheint?", "a": ["3, 2, 1", "3, 2", "2, 1, 0", "1, 2, 3"], "e": "Die Ausgabe erfolgt vor dem Verringern. Bei x=0 endet die Schleife."}, {"t": 7, "q": "summe=0; summe=summe+4; summe=summe+6. Ergebnis?", "a": ["10", "6", "4", "0"], "e": "Die zweite Addition verwendet die bereits vorhandene Summe 4."}, {"t": 7, "q": "Warum wird eine Summe gewöhnlich vor der Schleife auf 0 gesetzt?", "a": ["Damit die Addition mit einem definierten Anfangswert beginnt.", "Damit das Ergebnis immer 0 ist.", "Damit die Schleife nie startet.", "Damit alle Eingaben gleich sind."], "e": "Die folgenden Werte werden zu diesem Anfangswert addiert."}, {"t": 7, "q": "Was passiert, wenn summe=0 vor jeder Addition innerhalb der Schleife steht?", "a": ["Vorherige Teilsummen gehen verloren.", "Alle Werte werden korrekt addiert.", "Es entsteht automatisch der Durchschnitt.", "Die Schleife wird automatisch beendet."], "e": "Das Zurücksetzen verwirft den bisherigen Summenwert."}, {"t": 7, "q": "Was geschieht nach einem if/else-Block normalerweise?", "a": ["Der gemeinsame folgende Schritt wird ausgeführt.", "Der nicht gewählte Zweig wird nachgeholt.", "Das Programm beginnt immer neu.", "Alle Variablen werden gelöscht."], "e": "Nach genau einem Zweig geht es hinter der Alternative weiter."}], "exercises": [{"title": "Ein Grid mit Mobile First erweitern", "topic": 1, "kind": "code", "prompt": "Das kleine Raster ist vorgegeben. Ergänze @media screen and (min-width: 44.001em): body mit width:80vw, margin:auto, grid-gap:10px; drei Spalten 1fr 2fr 1fr; drei Zeilen 150px 1fr 50px. Rasterzeilen: \"header header header\", \"nav article aside\", \"footer footer footer\". Schreibe gemeinsame Regeln nicht doppelt. fr-Werte vermeiden 100%-Spalten plus zusätzliche Abstände.", "solution": "body {\n  height: 100vh;\n  display: grid;\n  grid-gap: 5px;\n  grid-template-columns: 1fr 1fr;\n  grid-template-rows: 100px 1fr 1fr 30px;\n  grid-template-areas:\n    \"header header\"\n    \"nav nav\"\n    \"article aside\"\n    \"footer footer\";\n}\nheader { grid-area: header; background-color: #025159; color: white; }\nnav { grid-area: nav; background-color: #3E848C; }\narticle { grid-area: article; background-color: #C4EEF2; }\naside { grid-area: aside; background-color: #C4EEF2; }\nfooter { grid-area: footer; background-color: #025159; color: white; }\n\n@media screen and (min-width: 44.001em) {\n  body {\n    width: 80vw;\n    margin: auto;\n    grid-gap: 10px;\n    grid-template-columns: 1fr 2fr 1fr;\n    grid-template-rows: 150px 1fr 50px;\n    grid-template-areas:\n      \"header header header\"\n      \"nav article aside\"\n      \"footer footer footer\";\n  }\n}", "checks": ["Kleine Ansicht bleibt die Basis", "Richtige Media Query und geänderte Größen", "Drei Spalten und passende Rasterzeilen", "Gemeinsame Regeln nicht doppelt"], "starter": "body {\n  height: 100vh;\n  display: grid;\n  grid-gap: 5px;\n  grid-template-columns: 1fr 1fr;\n  grid-template-rows: 100px 1fr 1fr 30px;\n  grid-template-areas:\n    \"header header\"\n    \"nav nav\"\n    \"article aside\"\n    \"footer footer\";\n}\nheader { grid-area: header; background-color: #025159; color: white; }\nnav { grid-area: nav; background-color: #3E848C; }\narticle { grid-area: article; background-color: #C4EEF2; }\naside { grid-area: aside; background-color: #C4EEF2; }\nfooter { grid-area: footer; background-color: #025159; color: white; }\n", "preview": "grid"}, {"title": "Vorname und Passwort ergänzen", "topic": 2, "kind": "code", "prompt": "Ergänze ein Textfeld Vorname mit name=\"Vorname\", size=\"25\" und einem Platzhalter sowie ein Passwortfeld mit name=\"passwort\". Verbinde jedes Feld über id und for mit einem Label. Ergänze input-Buttons zum Absenden und Zurücksetzen. Kommentiere das Textfeld.", "solution": "<form action=\"Datei.php\" method=\"post\">\n  <label for=\"vorname\">Vorname:</label>\n  <!-- Textfeld für den Vornamen -->\n  <input type=\"text\" id=\"vorname\" name=\"Vorname\" size=\"25\" placeholder=\"Hier Vorname eingeben\">\n  <label for=\"passwort\">Passwort:</label>\n  <input type=\"password\" id=\"passwort\" name=\"passwort\">\n  <input type=\"submit\" value=\"Datei absenden\">\n  <input type=\"reset\" value=\"Eingaben zurücksetzen\">\n</form>", "checks": ["text und password korrekt eingesetzt", "for passt jeweils zur eindeutigen id", "name, size und placeholder ergänzt", "submit, reset und Kommentar vorhanden"], "starter": "<form action=\"Datei.php\" method=\"post\">\n  <!-- Hier ergänzen -->\n</form>"}, {"title": "Eine Formularzeile kommentieren", "topic": 2, "kind": "text", "prompt": "Erkläre die Bedeutung aller Attribute und das Label:\n<label for=\"vorname\">Vorname:</label>\n<input type=\"text\" id=\"vorname\" name=\"Vorname\" size=\"25\" placeholder=\"Hier Vorname eingeben\">", "solution": "type=\"text\": normales Textfeld. id=\"vorname\": eindeutige Kennung für das Label. for=\"vorname\": verbindet die Beschriftung mit dieser id. name=\"Vorname\": Schlüssel bei der Übertragung. size=\"25\": ungefähr 25 Zeichen sichtbare Breite, keine maximale Textlänge. placeholder: Hinweis im leeren Feld.", "checks": ["type, id und name erklärt", "for/id-Zuordnung erklärt", "size nicht mit maximaler Textlänge verwechselt", "placeholder als Hinweis erkannt"]}, {"title": "Eine Alternative darstellen", "topic": 7, "kind": "draw", "prompt": "Lies eine Zahl x ein. Wenn x größer als 0 ist, gib „positiv“ aus. Andernfalls gib „nicht positiv“ aus. Zeichne dazu ein Struktogramm und beschrifte die beiden Zweige.", "solution": "Eingabe x → Alternative x>0: Ja-Zweig Ausgabe „positiv“, Nein-Zweig Ausgabe „nicht positiv“. Im Struktogramm stehen die Zweige nebeneinander unter der Bedingung.", "checks": ["Eingabe vor der Bedingung", "Bedingung x>0 korrekt", "Beide Zweige mit passender Ausgabe", "Darstellung als verschachtelte Blöcke ohne Pfeile"]}, {"title": "Eine Schleife als PAP zeichnen", "topic": 7, "kind": "draw", "prompt": "Zeichne einen PAP für diesen Ablauf: x=1. Solange x<=4 gilt: x ausgeben und anschließend x um 1 erhöhen. Danach „Ende“ ausgeben. Kennzeichne Ja/Nein und die Rückführung.", "solution": "Start → x=1 → Prüfung x<=4. Ja: Ausgabe x → x=x+1 → zurück zur Prüfung. Nein: Ausgabe „Ende“ → Ende. Ausgabe insgesamt: 1, 2, 3, 4, Ende.", "checks": ["Initialisierung vor der Schleife", "Prüfung vor dem Körper", "Ausgabe vor der Erhöhung", "Rückpfeil zur Bedingung", "Endausgabe außerhalb der Schleife"]}, {"title": "Vergleiche und Grenzwerte", "topic": 7, "kind": "text", "prompt": "Betrachte die Bedingungen x<5 und x<=5. Bestimme jeweils wahr/falsch für x=4, x=5 und x=6. Erkläre den Unterschied in einem Satz.", "solution": "Bei x<5: 4 → wahr, 5 → falsch, 6 → falsch. Bei x<=5: 4 → wahr, 5 → wahr, 6 → falsch. <= schließt den Grenzwert 5 ein, < nicht.", "checks": ["Alle sechs Ergebnisse korrekt", "Unterschied am Grenzwert erklärt"]}, {"title": "Eine Summe als Struktogramm", "topic": 7, "kind": "draw", "prompt": "Entwirf ein Struktogramm: summe=0 und i=1. Solange i<=3: i zur Summe addieren und danach i um 1 erhöhen. Zum Schluss summe ausgeben. Welche Ausgabe entsteht?", "solution": "summe=0 → i=1 → kopfgesteuerte Schleife i<=3 mit summe=summe+i und i=i+1 → Ausgabe summe. Die Summe entwickelt sich von 0 über 1 und 3 zu 6. Ausgabe: 6.", "checks": ["Summe und Zähler vor der Schleife initialisiert", "Addition und Erhöhung im Schleifenkörper", "Ausgabe außerhalb der Schleife", "Ergebnis 6"]}, {"title": "Algorithmus prüfen", "topic": 4, "kind": "text", "prompt": "Ein Ablauf lautet: x=1; solange x>0: Ausgabe x. Erkläre Finitheit und Terminierung an diesem Beispiel. Wie könnte man ihn sinnvoll verändern?", "solution": "Die Beschreibung ist endlich, der Ablauf terminiert aber nicht: x bleibt 1 und x>0 immer wahr. Eine Änderung wäre x=x-1 im Schleifenkörper. Dann wird einmal 1 ausgegeben und anschließend endet die Schleife.", "checks": ["Endliche Beschreibung erkannt", "Endlosschleife mit unverändertem x erklärt", "Sinnvolle Änderung vorgeschlagen"]}, {"title": "Radio-Labels und CSS ergänzen", "topic": 3, "kind": "code", "prompt": "Beide Optionen sollen dieselbe Radio-Gruppe bilden. Gib den Inputs unterschiedliche ids und setze direkt nach jeden Input ein zugehöriges Label. Ergänze CSS: Das Label der ausgewählten Option soll font-weight:900 erhalten.", "solution": "<input type=\"radio\" id=\"normal\" name=\"groesse\" value=\"normal\">\n<label for=\"normal\">Normal</label>\n<input type=\"radio\" id=\"gross\" name=\"groesse\" value=\"gross\">\n<label for=\"gross\">Groß</label>\n<style>\ninput[type=\"radio\"]:checked + label {\n  font-weight: 900;\n}\n</style>", "checks": ["Beide Inputs mit gleichem name", "Unterschiedliche ids und passende for-Werte", "Labels stehen direkt hinter den Inputs", ":checked + label mit font-weight:900"], "starter": "<input type=\"radio\" name=\"normal\" value=\"normal\"> Normal\n<input type=\"radio\" name=\"gross\" value=\"gross\"> Groß\n<style>\n/* Hier ergänzen */\n</style>"}, {"title": "Auswahlliste und Kommentar reparieren", "topic": 2, "kind": "code", "prompt": "Ergänze das fehlende schließende Tag der Auswahlliste. Füge passende Labels und ids für Lieblingsfarbe und Kommentar hinzu. Das Kommentarfeld soll 5 Zeilen und etwa 30 Zeichen breit sein.", "solution": "<form action=\"Datei.php\" method=\"post\">\n  <label for=\"farbe\">Lieblingsfarbe:</label>\n  <select id=\"farbe\" name=\"lieblingsfarbe\" size=\"1\">\n    <option>Rot</option>\n    <option>Blau</option>\n  </select>\n  <label for=\"kommentar\">Kommentar:</label>\n  <textarea id=\"kommentar\" name=\"Kommentar\" rows=\"5\" cols=\"30\"></textarea>\n</form>", "checks": ["select korrekt geschlossen", "Beide Labels richtig verbunden", "rows=\"5\" und cols=\"30\" gesetzt"], "starter": "<form action=\"Datei.php\" method=\"post\">\n  <select name=\"lieblingsfarbe\" size=\"1\">\n    <option>Rot</option>\n    <option>Blau</option>\n  <!-- Hier fehlt ein Tag -->\n  <textarea name=\"Kommentar\"></textarea>\n</form>"}, {"title": "Formular gestalten", "topic": 3, "kind": "code", "prompt": "Ergänze CSS: Formular mit Arial, blauem Hintergrund #525F84, weißer Schrift, 20px Innenabstand und 10px abgerundeten Ecken. Labels mit inline-block und 100px Breite. Eingabefelder bei Fokus mit weißem Hintergrund und schwarzer Schrift.", "solution": "<form>\n  <label for=\"name\">Name:</label>\n  <input id=\"name\" type=\"text\" name=\"Name\">\n</form>\n<style>\nform {\n  font-family: Arial;\n  background-color: #525F84;\n  color: white;\n  padding: 20px;\n  border-radius: 10px;\n}\nlabel { display: inline-block; width: 100px; }\ninput:focus { background-color: white; color: black; }\n</style>", "checks": ["Formular mit vorgegebenen Eigenschaften", "Labels mit inline-block und Breite", "Fokusregel mit lesbarer Schrift"], "starter": "<form>\n  <label for=\"name\">Name:</label>\n  <input id=\"name\" type=\"text\" name=\"Name\">\n</form>\n<style>\n/* Hier gestalten */\n</style>"}, {"title": "Ein Raster lesen", "topic": 0, "kind": "text", "prompt": "Erkläre die folgenden CSS-Angaben. Wie viele Spalten und Zeilen gibt es? Welchen Bereich belegt aside? Was bedeutet der Punkt?\ngrid-template-columns: 20% 20% 20% 20% 20%;\ngrid-template-rows: 150px 1fr 1fr 1fr 50px;\ngrid-template-areas:\n\". header header header header\"\n\"nav article article aside aside\"\n\"nav section section aside aside\"\n\"unternav unten unten aside aside\"\n\"footer footer footer footer footer\";", "solution": "Fünf Spalten mit je 20 % und fünf Zeilen. Erste Zeile 150px, letzte 50px; drei mittlere Zeilen teilen den freien Platz gleich auf. aside liegt in Spalten 4–5 und Zeilen 2–4. Der Punkt ist eine leere Zelle. Ein passendes aside-Element erhält grid-area: aside. Zusatzhinweis: 100 % Spaltenbreite plus grid-gap kann Überlauf verursachen.", "checks": ["Fünf Spalten und fünf Zeilen", "px und fr unterschieden", "aside richtig lokalisiert", "Punkt als leere Zelle erklärt"]}]};

function home(){show(`<div class="hero"><div><div class="eyebrow">BG24 · Deine Klausurvorbereitung</div><h1>Verstehen.<br>Ausprobieren.<br><span style="color:var(--accent)">Sicher werden.</span></h1><p>Von Mobile First bis zur Schleife. Übe genau die Themen deiner Checkliste – in deinem Tempo.</p><div class="row"><button class="primary" onclick="nav(2)">Schnelltest starten ↗</button><button onclick="nav(1)">Themen ansehen</button></div></div><div class="hero-art"><svg viewBox="0 0 340 250" aria-label="Dekorative Verzweigung"><g fill="none" stroke="#76915d" stroke-width="1.5"><path d="M170 30V65 M110 105H50V160 M230 105H290V160 M50 200V225H290V200 M170 225V245"/><path d="M170 60L240 105L170 150L100 105Z" fill="#263522"/><rect x="9" y="160" width="82" height="40" rx="8"/><rect x="249" y="160" width="82" height="40" rx="8"/></g><g fill="#c2f178" text-anchor="middle" font-family="monospace" font-size="13"><text x="170" y="25">START</text><text x="170" y="108">verstanden?</text><text x="50" y="149">ja</text><text x="290" y="149">noch nicht</text><text x="50" y="185">üben</text><text x="290" y="185">lernen</text></g></svg></div></div><div class="row" style="margin-bottom:24px"><span class="pill">96 Quizfragen</span><button onclick="nav(6)">Neu: Code & Ablauf trainieren →</button><button onclick="nav(7)">Meine Schwächen</button></div><div class="stats"><div><strong>${state.done.length}/8</strong><span>Kapitel abgehakt</span></div><div><strong>${state.attempts?Math.round(state.correct/state.attempts*100):0}%</strong><span>Quiz richtig · ${state.attempts} Antworten</span></div><div><strong>${state.wrong.length}</strong><span>Zum Wiederholen</span></div></div><div class="sectionhead"><h2>Dein Lernpfad</h2><span class="pill">Alle Klausurthemen</span></div><div class="grid">${DATA.lessons.map((l,i)=>`<button class="card topic" onclick="lesson=${i};nav(1)"><span class="num">0${i+1} ${state.done.includes(i)?' / erledigt':''}</span><h3>${l.title}</h3><p>${l.sub}</p><span class="foot"><span>${i<4?'HTML & CSS':'Algorithmen'}</span><span>↗</span></span></button>`).join('')}</div><div class="card sources" style="margin-top:24px"><h3>Themen und Niveau</h3><p>Die Themen folgen deiner Klausurcheckliste. Der HTML/CSS-Umfang orientiert sich an eurem Unterricht, einschließlich Labels. Alle Aufgaben sind allgemein formuliert und enthalten die nötigen Angaben direkt. Die PDFs und der Algorithmus-Link dienen als fachliche Grundlage.</p><div class="row"><a href="https://studyflix.de/informatik/algorithmus-4244" target="_blank" rel="noopener">Studyflix: Algorithmus ↗</a><a href="https://developer.mozilla.org/de/docs/Learn_web_development/Core/CSS_layout/Media_queries" target="_blank" rel="noopener">MDN: Media Queries ↗</a><a href="https://developer.mozilla.org/en-US/docs/Learn_web_development/Extensions/Forms/Your_first_form" target="_blank" rel="noopener">MDN: Formulare ↗</a></div><details><summary>Hinweise zur Nutzung</summary><p>Du brauchst nur diese Datei. Herunterladen und im Browser öffnen. Für GitHub Pages heißt sie bereits index.html. Keine Anmeldung, keine externen Bibliotheken. Nur die Quellenlinks benötigen Internet. Freie Texte und Zeichnungen vergleichst du selbst mit der Musterlösung; sie werden nicht automatisch benotet.</p></details><button class="quiet" onclick="resetProgress()">Lernfortschritt zurücksetzen</button></div>`)}

ext-anchor="middle">summe = 4 + 5</text><text x="225" y="230" text-anchor="middle">mittel = summe / 2</text>';str='<rect x="20" y="30" width="410" height="180"/><path class="flow" d="M20 90H430M20 150H430"/><text x="225" y="68" text-anchor="middle">summe = 0</text><text x="225" y="128" text-anchor="middle">summe = 4 + 5</text><text x="225" y="188" text-anchor="middle">mittel = summe / 2</text>';note='Die Anweisungen werden von oben nach unten ausgeführt.'}else{let isDo=k==='do';svg=isDo?'<rect x="145" y="50" width="160" height="45"/><text x="225" y="78" text-anchor="middle">i = i + 1</text><path class="flow" marker-end="url(#arrow)" d="M225 95V160"/><polygon points="225,160 315,205 225,250 135,205"/><text x="225" y="209" text-anchor="middle">i &lt; 3?</text><path class="flow" marker-end="url(#arrow)" d="M135 205H55V25H225V50"/><text x="70" y="194">Ja</text><path class="flow" marker-end="url(#arrow)" d="M225 250V315"/><text x="235" y="285">Nein</text>':'<polygon points="225,40 315,85 225,130 135,85"/><text x="225" y="89" text-anchor="middle">i &lt; 3?</text><path class="flow" marker-end="url(#arrow)" d="M225 130V185"/><text x="235" y="160">Ja</text><rect x="145" y="185" width="160" height="45"/><text x="225" y="213" text-anchor="middle">i = i + 1</text><path class="flow" marker-end="url(#arrow)" d="M145 207H55V20H225V40"/><path class="flow" marker-end="url(#arrow)" d="M315 85H385V300H225V320"/><text x="340" y="75">Nein</text>';str=isDo?'<rect x="20" y="40" width="410" height="180"/><rect x="55" y="40" width="375" height="110"/><text x="230" y="104" text-anchor="middle">i = i + 1</text><text x="225" y="193" text-anchor="middle">solange i &lt; 3</text>':'<rect x="20" y="40" width="410" height="180"/><rect x="55" y="110" width="375" height="110"/><text x="225" y="85" text-anchor="middle">solange i &lt; 3</text><text x="235" y="175" text-anchor="middle">i = i + 1</text>';note=(isDo?'Erst ausführen, dann prüfen: mindestens ein Durchlauf.':'Erst prüfen: null Durchläufe sind möglich.')+' Beispiel: i ist vorher auf 0 gesetzt. Im PAP ist die Schleife hier mit Raute und Rückpfeil dargestellt; alternativ sind Schleifenbegrenzungssymbole möglich.'}$('#diagrams').innerHTML=`<div class="split"><div><h3 style="margin-top:20px">PAP</h3><div class="diagram"><svg viewBox="0 0 450 390" role="img" aria-label="Programmablaufplan">${defs}${svg}</svg></div></div><div><h3 style="margin-top:20px">Struktogramm</h3><div class="diagram"><svg viewBox="0 0 450 250" role="img" aria-label="Struktogramm">${str}</svg></div></div></div><p>${note}</p>`}
function quizQuestion(){if(qi>=quiz.length){show(`<div class="narrow card"><div class="eyebrow">Runde abgeschlossen</div><h1>${points} / ${quiz.length}</h1><p>${points===quiz.length?'Stark. Probiere jetzt eine freie Aufgabe in der Werkstatt.':'Schau dir die unsicheren Themen an und wiederhole deine Fehler.'}</p><div class="row"><button class="primary" onclick="quizSetup()">Neue Runde</button><button onclick="nav(4)">Zur Werkstatt</button></div></div>`);return}answered=false;let q=DATA.questions[quiz[qi]];show(`<div class="narrow"><div class="row"><span class="pill">${DATA.lessons[q.t].title}</span><span class="small">Frage ${qi+1} / ${quiz.length} · ${points} richtig</span></div><div class="progress"><span style="width:${qi/quiz.length*100}%"></span></div><div class="card"><h2>${esc(q.q)}</h2><button class="quiet" onclick="toggleBookmark(${quiz[qi]},this)">${(state.bookmarks||[]).includes(quiz[qi])?'Gemerkt ✓':'Frage merken'}</button><div class="answers">${shuffle(q.a.map((a,i)=>({a,i}))).map((x,j)=>`<button class="answer" data-answer="${x.i}"><b>${'ABCD'[j]}</b><span>${esc(x.a)}</span></button>`).join('')}</div><div id="feedback" aria-live="polite"></div><button class="quiet" onclick="quizSetup()">Runde beenden</button></div></div>`);document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(+b.dataset.answer))}
function answer(a){if(answered)return;answered=true;const id=quiz[qi],q=DATA.questions[id],right=a===0;if(right){points++;state.correct++;state.wrong=state.wrong.filter(x=>x!==id)}else if(!state.wrong.includes(id))state.wrong.push(id);state.attempts++;state.qstats=state.qstats||{};let st=state.qstats[id]||(state.qstats[id]={tries:0,hits:0});st.tries++;if(right)st.hits++;save();document.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;if(+b.dataset.answer===0)b.classList.add('good');else if(+b.dataset.answer===a)b.classList.add('bad')});$('#feedback').innerHTML=`<div class="feedback"><strong>${right?'Richtig.':'Noch nicht ganz.'}</strong><p style="margin:8px 0">${esc(q.e)}</p><button class="primary" onclick="qi++;quizQuestion()">${qi+1===quiz.length?'Ergebnis ansehen':'Nächste Frage →'}</button></div>`}
function cardsSetup(){cardDeck=shuffle(DATA.questions.map((_,i)=>i).filter(i=>!state.known.includes(i)));ci=0;flipped=false;cardView()}
function cardView(){if(!cardDeck.length||ci>=cardDeck.length){show(`<div class="narrow card"><h2>Stapel geschafft.</h2><p>${state.known.length} von ${DATA.questions.length} Karten als sicher markiert.</p><button class="primary" onclick="cardsSetup()">Unsichere Karten üben</button> <button onclick="cardDeck=shuffle(DATA.questions.map((_,i)=>i));ci=0;flipped=false;cardView()">Alle Karten mischen</button></div>`);return}let q=DATA.questions[cardDeck[ci]];show(`<div class="narrow"><div class="sectionhead"><h2>Karteikarten</h2><span class="pill">${ci+1} / ${cardDeck.length}</span></div><p>Antworte zuerst im Kopf. Tippe dann auf die Karte.</p><button class="flash card" id="flip">${flipped?`<span><strong>${esc(q.a[0])}</strong><br><span style="font-size:16px;color:var(--muted)">${esc(q.e)}</span></span>`:esc(q.q)}</button><div class="row" style="margin-top:20px"><button onclick="flipped=!flipped;cardView()">${flipped?'Frage zeigen':'Antwort aufdecken'}</button>${flipped?'<button class="primary" onclick="rateCard(true)">Kann ich</button><button onclick="rateCard(false)">Noch unsicher</button>':''}</div></div>`);$('#flip').onclick=()=>{flipped=!flipped;cardView()}}
function rateCard(known){let id=cardDeck[ci];state.known=state.known.filter(x=>x!==id);if(known)state.known.push(id);save();ci++;flipped=false;cardView()}
function workshop(){let x=DATA.exercises[exercise];show(`<div class="sectionhead"><div><div class="eyebrow">Wissen anwenden</div><h2>Die Werkstatt</h2><p class="small">Allgemeine Übungen auf eurem Unterrichtsniveau: HTML/CSS mit Labels sowie Algorithmen, PAP und Struktogramme.</p></div><span class="pill">${DATA.exercises.length} Aufgaben</span></div><label for="exercise">Aufgabe wählen</label><select id="exercise">${DATA.exercises.map((x,i)=>`<option value="${i}" ${i===exercise?'selected':''}>${i+1}. ${x.title}</option>`).join('')}</select><div class="card exercise"><span class="pill">${DATA.lessons[x.topic].title}</span><h2 style="margin-top:18px">${x.title}</h2><p style="white-space:pre-line">${esc(x.prompt)}</p><label for="response">${x.kind==='code'?'Dein Code':'Deine Antwort / Ablaufbeschreibung'}</label><textarea id="response" class="${x.kind==='code'?'editor':''}" spellcheck="false">${esc(state.notes[(DATA.exercises[exercise].topic<4?'courseWork':([3,4,5,6].includes(exercise)?'generalWork':'work'))+exercise]??x.starter??'')}</textarea>${x.kind==='code'?'<div class="row"><button id="previewBtn">HTML/CSS-Vorschau</button><span class="small">Isoliert, ohne JavaScript oder Formularübertragung.</span></div><label for="previewWidth">Vorschau-Breite (CSS-Pixel)</label><select id="previewWidth"><option value="360">360 · schmal</option><option value="900">900 · breit</option></select><div style="overflow:auto"><iframe id="preview" title="Vorschau deines Codes" sandbox="" class="hidden"></iframe></div>':''}${x.kind==='draw'?'<details><summary>Zeichenfeld öffnen</summary><p class="small">Mit Finger, Stift oder Maus. Skizze wird lokal gespeichert, falls dein Browser das erlaubt.</p><canvas class="canvas" id="canvas" width="1000" height="500" aria-label="Zeichenfeld"></canvas><div class="row" style="margin-top:10px"><button id="clearCanvas">Zeichnung löschen</button><span class="small">Für präzise Diagramme kannst du auch Papier verwenden.</span></div></details>':''}<details><summary>Musterlösung & Selbstkontrolle</summary><pre>${esc(x.solution)}</pre>${x.checks.map((c,i)=>`<label class="check"><input type="checkbox">${esc(c)}</label>`).join('')}<p class="small">Prüfe die Bedeutung, nicht den exakten Wortlaut. Gleichwertige Lösungen sind möglich.</p></details></div>`);$('#exercise').onchange=e=>{exercise=+e.target.value;workshop()};$('#response').oninput=e=>{state.notes[(DATA.exercises[exercise].topic<4?'courseWork':([3,4,5,6].includes(exercise)?'generalWork':'work'))+exercise]=e.target.value;save()};if($('#previewBtn')){$('#previewBtn').onclick=()=>renderCodePreview();$('#previewWidth').onchange=()=>renderCodePreview()};if($('#canvas'))setupCanvas()}
function renderCodePreview(){let code=$('#response').value,frame=$('#preview');frame.classList.remove('hidden');frame.style.width=$('#previewWidth').value+'px';frame.style.maxWidth='none';frame.style.height='450px';let grid=DATA.exercises[exercise].preview==='grid';frame.srcdoc='<!doctype html><html lang="de"><head><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>body{font:16px Arial}input,select,textarea{font:inherit}</style>'+(grid?'<style>'+code+'</style>':'')+'</head><body>'+(grid?'<header>Header</header><nav>Navigation</nav><article>Artikel</article><aside>Formularbereich</aside><footer>Footer</footer>':code)+'</body></html>'}
function setupCanvas(){const c=$('#canvas'),ctx=c.getContext('2d'),key=([3,4,6].includes(exercise)?'generalDrawing':'drawing')+exercise;ctx.lineWidth=2.5;ctx.lineCap='round';ctx.strokeStyle='#17251c';if(state.notes[key]){let im=new Image;im.onload=()=>ctx.drawImage(im,0,0);im.src=state.notes[key]}let drawing=false;const xy=e=>{let r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};c.onpointerdown=e=>{drawing=true;c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...xy(e))};c.onpointermove=e=>{if(drawing){ctx.lineTo(...xy(e));ctx.stroke()}};const stop=()=>{if(!drawing)return;drawing=false;state.notes[key]=c.toDataURL();save()};c.onpointerup=stop;c.onpointercancel=stop;$('#clearCanvas').onclick=()=>{if(confirm('Diese Zeichnung löschen?')){ctx.clearRect(0,0,c.width,c.height);delete state.notes[key];save()}}}
const examTasks=[{"title": "Responsive & Mobile First", "points": 6, "prompt": "Definiere Responsive Webdesign. Vergleiche Mobile First und Desktop First. Schreibe CSS: body als Grid mit zwei gleich breiten Spalten; ab min-width:44.001em drei Spalten im Verhältnis 1:2:1. Verwende fr für die Aufteilung des freien Platzes.", "solution": "Responsive: Anpassung an verfügbare Breite (2 P). Mobile First: kleine Basis, große Erweiterung; Desktop First: große Basis, kleinere Anpassung (2 P). body { display:grid; grid-template-columns:1fr 1fr; } @media screen and (min-width:44.001em) { body { grid-template-columns:1fr 2fr 1fr; } } (2 P)."}, {"title": "HTML-Formular mit Labels", "points": 8, "prompt": "Schreibe ein Formular mit action=\"Datei.php\" und method=\"post\". Ergänze ein Textfeld für den Vornamen mit name=\"Vorname\", size=\"25\" und placeholder, ein verbundenes Label und input-Buttons für submit und reset. Erkläre id und name.", "solution": "form mit action und method (2 P). label for=\"vorname\" und input id=\"vorname\" (1 P). type=\"text\", name=\"Vorname\", size=\"25\" und placeholder (2 P). input type=\"submit\" und input type=\"reset\" mit value als Beschriftung (1 P). id identifiziert und verbindet das Label; name benennt den übertragenen Wert (2 P)."}, {title:'Algorithmus & Eigenschaften',points:6,prompt:'Definiere Algorithmus. Unterscheide Determinismus und Determiniertheit. Erkläre an einer Endlosschleife den Unterschied zwischen Finitheit und Terminierung.',solution:'Eindeutige Schrittfolge zur Problemlösung (2 P). Determinismus: eindeutiger Folgeschritt; Determiniertheit: gleiches Ergebnis bei gleichen Eingaben (2 P). Endlich beschreibbar bedeutet nicht, dass die Ausführung endet; unverändert wahre Schleifenbedingung als Beispiel (2 P).'}, {title:'Kontrollstrukturen',points:4,prompt:'Erkläre kopf- und fußgesteuerte Schleifen einschließlich minimaler Durchlaufzahl. Nenne den grundlegenden Unterschied zwischen PAP und Struktogramm.',solution:'Kopfgesteuert: Prüfung vorher, mindestens 0 Durchläufe (1 P). Fußgesteuert: Prüfung nachher, mindestens 1 (1 P). PAP: Symbole mit Ablaufpfeilen; Struktogramm: verschachtelte Blöcke ohne Ablaufpfeile (2 P).'}, {"title": "PAP entwerfen", "points": 6, "prompt": "Zeichne auf Papier einen PAP: summe=0, i=1. Solange i<=4: summe um i erhöhen und danach i um 1 erhöhen. Abschließend summe ausgeben. Beschreibe hier deinen Ablauf und nenne das Ergebnis.", "solution": "Start und Initialisierung summe=0, i=1 (1 P). Prüfung i<=4 vor dem Körper (1 P). summe=summe+i (1 P). i=i+1 und Rückführung (1 P). Ausgabe nach der Schleife: 10, danach Ende (1 P). Sinnvolle Symbole und beschriftete Zweige (1 P)."}];
function exam(){clearInterval(ticker);if(!examActive&&!examDone){show(`<div class="narrow card"><div class="eyebrow">Generalprobe</div><h2>30 Minuten. Fünf Aufgaben.</h2><p>30 mögliche Punkte, alle Themenbereiche. Schreibe frei und zeichne den PAP auf Papier. Die Lösungen erscheinen erst nach der Abgabe. Der Timer ist eine Orientierung, keine automatische Abgabe.</p><p class="small">Eigene Übungsklausur passend zur Checkliste, keine Vorhersage deiner echten Arbeit. Bewertung per Selbstkontrolle.</p><button class="primary" onclick="startExam()">Klausur starten</button></div>`);return}show(`<div class="sectionhead"><h2>${examDone?'Deine Auswertung':'Übungsklausur'}</h2><span class="pill" id="timer">${examDone?'Selbstkontrolle':'30:00'}</span></div>${examTasks.map((x,i)=>`<div class="card" style="margin-bottom:18px"><span class="small">Aufgabe ${i+1} · ${x.points} Punkte</span><h3>${x.title}</h3><p>${esc(x.prompt)}</p><label for="exam${i}">Deine Antwort</label><textarea id="exam${i}" data-exam="${i}" ${examDone?'readonly':''}>${esc(state.notes[(i<2?'courseExam':i===4?'generalExam':'exam')+i]||'')}</textarea>${examDone?`<div class="feedback"><strong>Erwartungshorizont</strong><p>${esc(x.solution)}</p><label for="score${i}">Erreichte Punkte (0–${x.points})</label><input id="score${i}" data-score="${i}" type="number" min="0" max="${x.points}" step="1" value="0"></div>`:''}</div>`).join('')}<div class="card">${examDone?'<h2 id="examTotal">0 / 30 Punkte</h2><p>Orientierung durch deine eigene Bewertung; keine offizielle Note.</p><button onclick="examDone=false;exam();">Zur Startseite der Klausur</button>':'<button class="primary" onclick="finishExam()">Abgeben & Lösungen zeigen</button><p class="small">Antworten werden in diesem Browser gespeichert. Bei Verlassen dieses Tabs läuft der Timer weiter; ein Neuladen beendet die laufende Zeitmessung.</p>'}</div>`);document.querySelectorAll('[data-exam]').forEach(el=>el.oninput=()=>{state.notes[(+el.dataset.exam<2?'courseExam':+el. async function importProgress(e){try{let file=e.target.files[0];if(!file)return;if(file.size>10000000)throw Error('Datei ist zu groß.');let data=JSON.parse(await file.text()),v=data.state;const ids=(a,max)=>Array.isArray(a)&&a.every(x=>Number.isInteger(x)&&x>=0&&x<max);if(data.app!=='informatik-studio'||!v||!ids(v.done,8)||!ids(v.known,96)||!ids(v.wrong,96)||!ids(v.bookmarks||[],96)||!Number.isInteger(v.attempts)||v.attempts<0||!Number.isInteger(v.correct)||v.correct<0||v.correct>v.attempts||!v.notes||typeof v.notes!=='object'||Array.isArray(v.notes)||Object.values(v.notes).some(x=>typeof x!=='string'))throw Error('Das ist kein gültiger Lernstand.');let qs={};for(let [k,x]of Object.entries(v.qstats||{})){if(!/^\d+$/.test(k)||+k>=96||!Number.isInteger(x.tries)||x.tries<1||!Number.isInteger(x.hits)||x.hits<0||x.hits>x.tries)throw Error('Ungültige Statistik.');qs[k]={tries:x.tries,hits:x.hits}}if(!confirm('Den aktuellen Lernstand durch diese Sicherung ersetzen?'))return;state={done:v.done,known:v.known,wrong:v.wrong,bookmarks:v.bookmarks||[],attempts:v.attempts,correct:v.correct,notes:v.notes,qstats:qs,theme:v.theme==='light'?'light':'dark',courseRevision:v.courseRevision,generalRevision:v.generalRevision};migrateCourse();migrateGeneral();save();theme();progressView();$('#importFeedback').textContent='Lernstand importiert.'}catch(err){$('#importFeedback').textContent='Import fehlgeschlagen: '+err.message}}

function trainer(){show(`<div class="sectionhead"><div><div class="eyebrow">Selber denken, direkt prüfen</div><h2>Aktiv trainieren</h2></div></div><div class="row" style="margin-bottom:22px"><button onclick="trainingMode='gap';trainer()" class="${trainingMode==='gap'?'primary':''}">20 Lückencode-Aufgaben</button><button onclick="trainingMode='order';trainer()" class="${trainingMode==='order'?'primary':''}">8 Abläufe ordnen</button><button onclick="trainingMode='sim';trainer()" class="${trainingMode==='sim'?'primary':''}">Algorithmus Schritt für Schritt</button></div><div id="trainingBody"></div>`);if(trainingMode==='gap')gapView();if(trainingMode==='order'){if(!orderParts.length)newOrder();else orderView()}if(trainingMode==='sim')simView()}

function makeFrames(type,start,limit){let out=[],frames=[],i=start,sum=0;const f=(line,note)=>frames.push({line,note,i,sum,out:[...out]});f(0,'Startwert setzen.');if(type==='sum'){for(let n=1;n<=limit;n++){i=n;f(1,'Nächste Zahl: '+i);sum+=i;f(2,'Diese Zahl zur bisherigen Summe addieren.')}out=[sum];f(3,'Fertige Summe ausgeben.')}else if(type==='while'){while(true){f(1,`${i} < ${limit} ist ${i<limit?'wahr: Körper ausführen.':'falsch: Schleife verlassen.'}`);if(i>=limit)break;i++;f(2,'i um 1 erhöhen.');out.push(i);f(3,'Aktuellen Wert ausgeben.')}f(4,'Ende.')}else{do{i++;f(1,'Körper beginnt ohne vorherige Prüfung: i erhöhen.');out.push(i);f(2,'Aktuellen Wert ausgeben.');f(3,`${i} < ${limit} ist ${i<limit?'wahr: erneut ausführen.':'falsch: beenden.'}`)}while(i<limit);f(4,'Ende.')}return frames}
