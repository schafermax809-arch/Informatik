<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark light"><title>Informatik · Lernstudio</title><style>
:root{--bg:#101413;--panel:#191f1d;--soft:#232c28;--line:#34433b;--text:#f0f4ec;--muted:#a7b4aa;--accent:#c2f178;--ink:#17250c;--red:#ffad9c;--blue:#b9d9f0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,Segoe UI,sans-serif}body.light{--bg:#f2f4ed;--panel:#fff;--soft:#e8eddf;--line:#ccd5c5;--text:#17241c;--muted:#53634f;--accent:#c2ee79;--red:#a63427;--blue:#265976}button,input,select,textarea{font:inherit}button,a,input,select,textarea{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:default;opacity:.65}button,.btn{border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--text);padding:10px 16px;text-decoration:none;display:inline-block}button:hover:not(:disabled),.btn:hover{border-color:var(--accent)}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.primary{background:var(--accent);color:var(--ink);border-color:var(--accent);font-weight:700}.quiet{background:transparent}header{border-bottom:1px solid var(--line);padding:20px max(20px,calc((100vw - 1200px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:800;letter-spacing:-.8px;font-size:21px}.mark{color:var(--accent);margin-right:10px;font-family:monospace}.light .mark{color:#42681c}.small{font-size:13px;color:var(--muted)}main{max-width:1200px;margin:auto;padding:30px 24px 80px}nav{display:flex;gap:6px;overflow:auto;padding:5px 0 18px;margin-bottom:20px}nav button{white-space:nowrap;border-color:transparent;background:transparent;color:var(--muted)}nav button.active{background:var(--soft);color:var(--text);border-color:var(--line)}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(36px,6vw,64px);line-height:1.08;letter-spacing:-2.6px;max-width:650px;margin-bottom:20px}h2{font-size:28px;letter-spacing:-.8px;line-height:1.25}h3{font-size:19px;line-height:1.35}p{color:var(--muted)}.eyebrow{text-transform:uppercase;letter-spacing:2px;font:12px monospace;color:var(--accent);margin-bottom:17px}.light .eyebrow{color:#42681c}.light h1 span{color:#416b19!important}.hero{display:grid;gap:24px;padding:15px 0 35px}.hero p{max-width:530px}.hero-art{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;display:flex;align-items:center;justify-content:center;min-height:230px;position:relative}.hero-art:before{content:'ABLAUF / 01';position:absolute;top:18px;left:20px;font:11px monospace;color:var(--muted)}.hero-art svg{width:100%;max-width:340px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grid{display:grid;gap:16px}.card{padding:24px;border:1px solid var(--line);border-radius:16px;background:var(--panel);min-width:0}.topic{display:flex;flex-direction:column;align-items:stretch;text-align:left;min-height:190px}.topic .num{font:13px monospace;color:var(--muted);margin-bottom:18px}.topic p{font-size:14px;margin-bottom:18px}.topic .foot{margin-top:auto;display:flex;justify-content:space-between;font-size:13px}.pill{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:50px;padding:4px 10px;font-size:12px;color:var(--muted)}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:22px 0 16px}.sectionhead h2{margin:0}.progress{height:5px;background:var(--soft);border-radius:6px;overflow:hidden;margin:10px 0 24px}.progress span{display:block;height:100%;background:var(--accent);transition:width .3s}.stack>*+*{margin-top:18px}pre{background:var(--bg);padding:20px;border:1px solid var(--line);border-radius:10px;overflow:auto;font:14px/1.7 ui-monospace,Consolas,monospace;color:var(--blue);tab-size:2}code{font-family:ui-monospace,Consolas,monospace}.callout{border-left:3px solid var(--accent);padding:14px 18px;background:var(--soft);border-radius:0 8px 8px 0}.callout p{margin:0;color:var(--text)}.narrow{max-width:850px;margin:auto}.answers{display:grid;gap:12px;margin:25px 0}.answer{text-align:left;display:flex;gap:14px;align-items:center;padding:17px}.answer b{font:12px monospace;color:var(--muted)}.answer.good{border-color:var(--accent);background:#2a4021;color:#eaffdd}.answer.bad{border-color:var(--red);background:#4c2724;color:#ffe8e3}.feedback{margin:16px 0;padding:18px;border:1px solid var(--line);border-radius:12px}.flash{min-height:280px;display:flex;align-items:center;justify-content:center;text-align:center;width:100%;padding:32px;font-size:24px;line-height:1.45;background:var(--panel)}label{display:block;margin:10px 0 5px}select,input[type=text],input[type=number],textarea{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:12px;max-width:100%}select{min-height:46px}textarea{width:100%;min-height:200px;resize:vertical}textarea.editor{font:14px/1.65 ui-monospace,monospace;min-height:260px;tab-size:2}iframe{width:100%;height:240px;background:white;border:1px solid var(--line);border-radius:10px}.exercise{border-top:1px solid var(--line);padding-top:24px;margin-top:24px}.check{display:flex;align-items:start;gap:10px;margin:10px 0;color:var(--muted)}input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px;margin-top:5px;flex-shrink:0}details{border-top:1px solid var(--line);padding:16px 0}summary{cursor:pointer;font-weight:650}details p{margin:12px 0}.diagram{overflow:auto;background:#f8fbf4;border-radius:12px;padding:14px;margin:18px 0;color:#243324}.diagram svg{width:100%;min-width:420px;max-height:600px}.diagram svg text{font:14px system-ui;fill:#243324}.diagram svg rect,.diagram svg polygon,.diagram svg path.box{fill:#edf4e5;stroke:#587745;stroke-width:1.5}.diagram svg .flow{fill:none;stroke:#587745;stroke-width:1.5}.canvas{display:block;width:100%;height:380px;background:#fff;border:1px solid var(--line);border-radius:10px;touch-action:none}.status{color:var(--muted);font-size:13px}.stats{display:flex;gap:30px;margin-bottom:20px}.stats strong{font-size:28px;font-weight:550;display:block;line-height:1.2}.stats span{font-size:12px;color:var(--muted)}.sources{font-size:14px}.sources a{color:var(--blue);overflow-wrap:anywhere}.hidden{display:none!important}.view{animation:arrive .25s ease}@keyframes arrive{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@media(min-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:1.4fr 1fr}.split{display:grid;grid-template-columns:1fr 1fr;gap:22px}}@media(min-width:1050px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:500px){main{padding:20px 16px 60px}.card{padding:19px}.hero-art{display:none}header{padding:16px}.brand{font-size:18px}.sectionhead{align-items:start}.stats{gap:24px}h1{letter-spacing:-1.4px}.flash{font-size:20px}.row>select{width:100%}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media print{header,nav,.no-print{display:none}body{background:white;color:black}.card{break-inside:avoid}p{color:#333}}
</style></head><body><header><div class="brand"><span class="mark">&lt;/&gt;</span>Informatik<span class="small"> / Lernstudio</span></div><button id="theme" class="quiet" aria-label="Farbschema wechseln">Hell</button></header><main><nav aria-label="Hauptnavigation"></nav><div id="app"></div><p class="small" id="saveStatus" style="margin-top:32px">Dein Fortschritt bleibt in diesem Browser. Funktioniert auch offline.</p></main><script>
const DATA={"lessons": [{"title": "Responsive Design", "sub": "Eine Website, viele Bildschirmgrößen.", "text": "Responsive Webdesign passt Layout, Bilder und Schrift an den verfügbaren Platz an. Inhalte bleiben auf Smartphone, Tablet und Desktop bedienbar. Flexible Breiten und Media Queries helfen dabei.", "tip": "Merke: Responsive heißt nicht nur, alles kleiner zu machen. Spalten können untereinander rutschen.", "code": "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<style>\n  img { max-width: 100%; height: auto; }\n  .inhalt { width: 100%; max-width: 1100px; margin: auto; }\n</style>"}, {"title": "Mobile First", "sub": "Klein anfangen, gezielt erweitern.", "text": "Die Grundregeln gelten für kleine Bildschirme. Ab einem Breakpoint ergänzt eine min-width-Abfrage die Regeln für größere Ansichten. Desktop First startet mit dem großen Layout und passt es mit max-width für kleinere Breiten an.", "tip": "Optimieren: gemeinsame Regeln einmal schreiben; nur Änderungen in Media Queries. Breakpoints nach Inhalt wählen.", "code": "/* Mobile First: Basis */\n.karten { display: grid; grid-template-columns: 1fr; gap: 16px; }\n@media (min-width: 768px) {\n  .karten { grid-template-columns: repeat(2, 1fr); }\n}\n@media (min-width: 1100px) {\n  .karten { grid-template-columns: repeat(3, 1fr); }\n}"}, {"title": "HTML-Formulare", "sub": "Eingaben sinnvoll erfassen.", "text": "form fasst Felder zusammen. action nennt das Ziel, method die Übertragungsmethode. label beschriftet ein Feld: for muss zur id passen. name ist der Schlüssel der übertragenen Eingabe. type bestimmt die Feldart.", "tip": "id verbindet und identifiziert. name benennt die gesendeten Daten. Ein placeholder ersetzt kein label.", "code": "<form action=\"auswertung.php\" method=\"post\">\n  <!-- Beschriftung und Zahlenfeld gehören zusammen -->\n  <label for=\"alter\">Alter</label>\n  <input id=\"alter\" name=\"alter\" type=\"number\" min=\"0\" required>\n  <button type=\"submit\">Senden</button>\n</form>"}, {"title": "Felder & CSS", "sub": "Das passende Element auswählen.", "text": "text: kurze Texte; email: E-Mail; number: Zahlen; radio: eine Auswahl in einer Gruppe mit gleichem name; checkbox: unabhängige Optionen; select/option: Auswahlliste; textarea: mehrzeiliger Text. required verlangt eine Eingabe, min/max begrenzen Zahlen.", "tip": "HTML-Kommentar: <!-- Erklärung -->. CSS-Kommentar: /* Erklärung */. POST verschlüsselt Daten nicht automatisch.", "code": "<label for=\"nachricht\">Nachricht</label>\n<textarea id=\"nachricht\" name=\"nachricht\"></textarea>\n<select name=\"groesse\" aria-label=\"Größe\">\n  <option value=\"normal\">Normal</option>\n  <option value=\"gross\">Groß</option>\n</select>\n<style>\n  * { box-sizing: border-box; }\n  input, select, textarea { width: 100%; padding: 12px; }\n  input[type=\"radio\"], input[type=\"checkbox\"] { width: auto; }\n</style>"}, {"title": "Algorithmen", "sub": "Vom Problem zur Schrittfolge.", "text": "Ein Algorithmus beschreibt eine eindeutige Schrittfolge zur Lösung einer Aufgabe. Ein Programm setzt einen solchen Ablauf in einer Programmiersprache um. Eingabe → Verarbeitung → Ausgabe ist ein häufiges Grundschema.", "tip": "Studyflix nennt: Ausführbarkeit (machbare Schritte), Determinismus (eindeutiger nächster Schritt), Determiniertheit (gleiche Eingaben, gleiches Ergebnis), Finitheit (endliche Beschreibung) und Terminierung (Ablauf endet). Finitheit und Terminierung sind verschieden: Eine kurze Endlosschleife endet trotzdem nie.", "code": "Eingabe: a, b\nWenn a > b:\n    Ausgabe a\nSonst:\n    Ausgabe b"}, {"title": "Kontrollstrukturen", "sub": "Reihenfolge, Auswahl, Wiederholung.", "text": "Sequenz: Anweisungen nacheinander. Alternative: je nach Bedingung ein Zweig. Mehrfachauswahl: einer von mehreren Fällen. Zählergesteuerte Schleife: feste Anzahl. Kopfgesteuert: vor dem Durchlauf prüfen, also auch 0 Durchläufe möglich. Fußgesteuert: erst ausführen, dann prüfen, also mindestens 1 Durchlauf.", "tip": "Dein Blatt verwendet bei der fußgesteuerten Schleife „solange Bedingung wahr“. Bei „wiederhole bis“ ist die Logik umgekehrt: Bei wahr wird beendet.", "code": "i = 1\nSolange i <= 3:\n    Ausgabe i\n    i = i + 1\n// Ausgabe: 1, 2, 3"}, {"title": "PAP & Struktogramm", "sub": "Ein Ablauf, zwei Darstellungen.", "text": "Ein PAP verbindet Symbole mit gerichteten Pfeilen. Ein Struktogramm verschachtelt rechteckige Blöcke ohne Ablaufpfeile. Sequenzen liegen untereinander, Zweige nebeneinander und Schleifen umschließen ihren Körper.", "tip": "PAP: abgerundetes Symbol = Start/Ende, Rechteck = Verarbeitung, Raute = Entscheidung, Parallelogramm = Ein-/Ausgabe. Dein Blatt zeigt für Schleifen außerdem gepaarte Schleifenbegrenzungen.", "code": "Beim Zeichnen prüfen:\n1. Alle Anweisungen in der richtigen Reihenfolge?\n2. Bedingungen und Zweige klar beschriftet?\n3. Schleife mit sinnvoller Bedingung und Änderung?\n4. Beide Zweige anschließend richtig zusammengeführt?"}, {"title": "Aufgaben aus deiner Mappe", "sub": "Kaffee, Zahlenraten und mehr.", "text": "Kaffeeverkauf: Größe wählen, Kaffeesorte wählen, Süßen abfragen, nur bei Ja das Süßungsmittel wählen, zuletzt bezahlen. Zahlenraten: Geheimzahl festlegen, Tipp einlesen, bei falschem Tipp einen Hinweis geben und erneut einlesen. Erfolg nach der Schleife ausgeben.", "tip": "Korrektur zu Aufgabe 2: Bei Tipp < Geheimzahl ist der Tipp zu klein. In der gelieferten Lösung sind Hinweise vertauscht; die Gleichheitsprüfung innerhalb „solange ungleich“ ist unerreichbar. Die Übungen hier verwenden den korrigierten Ablauf.", "code": "Geheimzahl = 42\nTipp einlesen\nSolange Tipp != Geheimzahl:\n    Wenn Tipp < Geheimzahl: Ausgabe \"Zu klein\"\n    Sonst: Ausgabe \"Zu groß\"\n    Tipp erneut einlesen\nAusgabe \"Zahl gefunden\""}], "questions": [{"t": 0, "q": "Was beschreibt Responsive Webdesign?", "a": ["Das Layout passt sich an den verfügbaren Platz an.", "Die Seite lädt nur auf Handys.", "Alle Elemente haben feste Pixelbreiten.", "HTML wird durch CSS ersetzt."], "e": "Inhalte und Bedienung passen sich unterschiedlichen Ansichten an."}, {"t": 0, "q": "Warum sind 1200px feste Breite auf einem Handy problematisch?", "a": ["Der Inhalt kann horizontal überlaufen.", "Die Schrift wird automatisch fett.", "Media Queries werden gelöscht.", "HTML erlaubt keine Pixel."], "e": "Flexible Breiten verhindern, dass ein breiter Container aus dem Viewport ragt."}, {"t": 0, "q": "Wofür steht der Viewport?", "a": ["Der sichtbare Anzeigebereich der Webseite.", "Die Größe der HTML-Datei.", "Die maximale Bildauflösung.", "Die Zahl der CSS-Regeln."], "e": "Media Queries mit width prüfen die Breite des Viewports."}, {"t": 1, "q": "Welche Abfrage passt zu Mobile First?", "a": ["@media (min-width: 768px)", "@media (max-width: 768px) als einzige Desktop-Basis", "@mobile (768px)", "@screen-width = 768px"], "e": "Die kleinen Grundregeln werden ab einer Mindestbreite ergänzt."}, {"t": 1, "q": "Was gilt bei min-width: 768px genau bei 768px?", "a": ["Die Regeln greifen.", "Die Regeln greifen erst bei 769px.", "Die Regeln gelten nur unter 768px.", "Die Regeln gelten nie exakt."], "e": "min-width schließt den Grenzwert ein."}, {"t": 1, "q": "Was ist eine sinnvolle CSS-Optimierung?", "a": ["Gemeinsame Regeln in die Basis, Unterschiede in Media Queries.", "Alle Regeln in jeder Media Query wiederholen.", "Alle Größen mit !important versehen.", "HTML in die CSS-Datei schreiben."], "e": "So bleibt der Code kürzer und Änderungen sind übersichtlicher."}, {"t": 1, "q": "Was bedeutet Desktop First?", "a": ["Großes Grundlayout, Anpassungen für kleinere Breiten.", "Die Seite funktioniert ausschließlich am PC.", "Man darf keine Media Queries nutzen.", "Das HTML muss auf einem Desktop geschrieben werden."], "e": "Typisch sind max-width-Abfragen für kleinere Ansichten."}, {"t": 2, "q": "Was verbindet label und input?", "a": ["for des Labels entspricht id des Inputs.", "name des Labels entspricht type des Inputs.", "Beide müssen dieselbe Farbe haben.", "Beide brauchen dasselbe action."], "e": "Die Verbindung ermöglicht auch das Aktivieren des Felds durch Klick auf die Beschriftung."}, {"t": 2, "q": "Welche Aufgabe hat name bei einem Formularfeld?", "a": ["Es benennt den Schlüssel bei der Übertragung.", "Es legt die Textfarbe fest.", "Es ersetzt immer das label.", "Es definiert den Breakpoint."], "e": "Beispiel: name=\"alter\" überträgt den Wert unter dem Schlüssel alter."}, {"t": 2, "q": "Was legt action fest?", "a": ["Das Ziel der Formularübermittlung.", "Die Feldfarbe.", "Die Eingabeart.", "Die Schriftgröße."], "e": "action=\"auswertung.php\" adressiert die Verarbeitung auf dieser Zielseite."}, {"t": 2, "q": "Was bewirkt required?", "a": ["Das Feld muss für reguläres Absenden ausgefüllt sein.", "Das Feld ist schreibgeschützt.", "Das Feld wird nicht gesendet.", "Das Feld nimmt ausschließlich Zahlen an."], "e": "required ist eine Vorgabe für die clientseitige Validierung."}, {"t": 3, "q": "Wie bildet man eine Radio-Gruppe?", "a": ["Gleicher name, unterschiedliche Werte.", "Unterschiedliche name, gleiche id.", "Alle Felder type=\"text\".", "Jedes Feld benötigt ein eigenes form."], "e": "Mit gleichem name gehört die Auswahl zusammen: ein Wert kann gewählt sein."}, {"t": 3, "q": "Welches Element passt zu mehrzeiligem Text?", "a": ["textarea", "input type=\"number\"", "option", "button"], "e": "textarea ist für längere, mehrzeilige Eingaben gedacht."}, {"t": 3, "q": "Welche Kommentarsyntax gehört zu CSS?", "a": ["/* Erklärung */", "<!-- Erklärung -->", "<comment>Erklärung</comment>", "# Erklärung"], "e": "HTML nutzt <!-- ... -->, CSS nutzt /* ... */."}, {"t": 3, "q": "Was tut box-sizing: border-box?", "a": ["Padding und Rahmen zählen zur angegebenen Breite.", "Alle Felder werden unsichtbar.", "Es aktiviert POST.", "Es entfernt alle Abstände."], "e": "So wird ein Feld mit width:100% durch Padding nicht breiter als der Container."}, {"t": 4, "q": "Was ist ein Algorithmus?", "a": ["Eine eindeutige Schrittfolge zur Lösung einer Aufgabe.", "Nur ein fertiges Computerprogramm.", "Immer eine mathematische Formel.", "Jede beliebige Liste ohne Reihenfolge."], "e": "Die Beschreibung kann auch ohne konkrete Programmiersprache erfolgen."}, {"t": 4, "q": "Was unterscheidet Determinismus von Determiniertheit?", "a": ["Eindeutiger Folgeschritt gegenüber gleichem Ergebnis bei gleichen Eingaben.", "Beides bedeutet ausschließlich: schnell.", "Determinismus betrifft Farben, Determiniertheit Formen.", "Beides bedeutet: unendlich viele Schritte."], "e": "Ablauf und Ergebnis sind zwei unterschiedliche Aspekte."}, {"t": 4, "q": "Eine kurze Endlosschleife: Was fehlt?", "a": ["Terminierung.", "Eine endliche Beschreibung.", "Zwingend die Ausführbarkeit.", "Zwingend jede eindeutige Anweisung."], "e": "Die Beschreibung kann endlich sein, während die Ausführung niemals aufhört."}, {"t": 4, "q": "„Sortiere diese Liste irgendwie“ ist problematisch, weil …", "a": ["die konkreten Schritte nicht eindeutig festgelegt sind.", "Listen nie sortiert werden können.", "Algorithmen nur Zahlen addieren.", "eine Ausgabe verboten ist."], "e": "Ein nachvollziehbarer Ablauf braucht präzise Anweisungen."}, {"t": 5, "q": "Welche Schleife kann ihren Körper komplett überspringen?", "a": ["Kopfgesteuerte Schleife.", "Fußgesteuerte Schleife.", "Jede Schleife läuft immer einmal.", "Keine Schleife."], "e": "Ist die Bedingung schon am Anfang falsch, gibt es keinen Durchlauf."}, {"t": 5, "q": "Welche Schleife läuft mindestens einmal?", "a": ["Fußgesteuerte Schleife.", "Kopfgesteuerte Schleife.", "Eine Schleife mit 0 Wiederholungen.", "Eine Alternative."], "e": "Die Bedingung wird erst nach dem Körper geprüft."}, {"t": 5, "q": "i=1; solange i<=3: Ausgabe i; i=i+1. Was erscheint?", "a": ["1, 2, 3", "1, 2", "0, 1, 2", "2, 3, 4"], "e": "Prüfen vor der Ausgabe; nach Ausgabe 3 wird i=4 und die Bedingung falsch."}, {"t": 5, "q": "Was ist eine Sequenz?", "a": ["Mehrere Anweisungen werden nacheinander ausgeführt.", "Eine Auswahl zwischen zwei Fällen.", "Eine Wiederholung ohne Ende.", "Eine Zufallszahl."], "e": "Die Reihenfolge ist vorgegeben, ohne Verzweigung."}, {"t": 6, "q": "Welche PAP-Form steht für eine Entscheidung?", "a": ["Raute", "Rechteck", "Abgerundetes Startsymbol", "Pfeil"], "e": "Die ausgehenden Wege müssen eindeutig bezeichnet sein, z. B. Ja und Nein."}, {"t": 6, "q": "Was ist typisch für ein Struktogramm?", "a": ["Verschachtelte Blöcke ohne Ablaufpfeile.", "Nur Kreise mit Pfeilen.", "Ausschließlich Programmcode.", "Frei verteilte Symbole ohne Struktur."], "e": "Die räumliche Anordnung zeigt den Ablauf und die Verschachtelung."}, {"t": 6, "q": "Wofür steht das Rechteck im PAP?", "a": ["Verarbeitung bzw. Anweisung.", "Nur Start.", "Immer eine Entscheidung.", "Immer eine Ein-/Ausgabe."], "e": "Beispiel: summe = summe + lohn."}, {"t": 6, "q": "Was müssen die zwei Ausgänge einer Bedingung deutlich machen?", "a": ["Welcher Weg bei wahr bzw. falsch gilt.", "Welche Farbe der Nutzer mag.", "Welche Datei größer ist.", "Dass beide Zweige immer laufen."], "e": "Genau der zur Bedingung passende Zweig wird ausgeführt."}, {"t": 7, "q": "Geheimzahl 42, Tipp 60. Welcher Hinweis stimmt?", "a": ["Zu groß.", "Zu klein.", "Zahl gefunden.", "Kein Hinweis möglich."], "e": "60 ist größer als 42. Vergleiche den Tipp mit der Geheimzahl."}, {"t": 7, "q": "Wo gehört „Zahl gefunden“ beim Zahlenraten hin?", "a": ["Nach die Schleife „solange Tipp ungleich Geheimzahl“.", "In deren unerreichbaren Gleichheitszweig.", "Immer vor den ersten Tipp.", "Nur in den Zweig „zu klein“."], "e": "Die Schleife endet gerade dann, wenn der Tipp passt."}, {"t": 7, "q": "Wann fragt der Kaffeeverkauf nach Zucker oder Süßstoff?", "a": ["Nur wenn Süßen gewünscht ist.", "Immer vor der Größenwahl.", "Nur wenn nicht gesüßt wird.", "Erst nach Ende des gesamten Ablaufs."], "e": "Die Auswahl des Süßungsmittels ist im Ja-Zweig verschachtelt."}, {"t": 7, "q": "Saft-Aufgabe: 100 Kisten kosten je 6 €. Gesamtpreis?", "a": ["600 €", "700 €", "800 €", "500 €"], "e": "Laut Mappe gilt 100–1000: 6 € pro Kiste. 100 · 6 = 600 €. Es ist kein Stufentarif."}, {"t": 7, "q": "Warum wird beim Zahlenraten in der Schleife erneut eingelesen?", "a": ["Damit sich der Tipp ändern und die Schleife enden kann.", "Damit die Geheimzahl immer wechselt.", "Weil nur so eine Sequenz entsteht.", "Weil Ausgaben sonst verboten sind."], "e": "Ohne neuen Tipp bleibt eine falsche Eingabe unverändert."}, {"t": 0, "q": "Welche Regel verhindert, dass ein Bild breiter als sein Container wird?", "a": ["max-width: 100%", "width: 1000px", "min-width: 1000px", "height: 100%"], "e": "max-width begrenzt die Breite auf den verfügbaren Platz."}, {"t": 0, "q": "Warum ergänzt man bei flexiblen Bildern height: auto?", "a": ["Damit das Seitenverhältnis erhalten bleibt.", "Damit alle Bilder quadratisch sind.", "Damit die Bilddatei kleiner wird.", "Damit das Bild nicht lädt."], "e": "Die Höhe ergibt sich proportional aus der Breite."}, {"t": 0, "q": "Ein Container hat width: 90%. Worauf bezieht sich die Breite normalerweise?", "a": ["Auf die Breite seines umgebenden Blocks.", "Immer auf die gesamte Bildschirmauflösung.", "Auf seine eigene Höhe.", "Auf die Textlänge."], "e": "Prozentwerte beziehen sich hier auf den umgebenden Block."}, {"t": 0, "q": "Welche Änderung hilft einer Navigation auf schmalen Displays?", "a": ["Elemente umbrechen oder ein angepasstes Menü anbieten.", "Die Links auf 4px verkleinern.", "Den Container auf 1600px setzen.", "Den Zoom verbieten."], "e": "Die Bedienung muss auch bei wenig Platz erhalten bleiben."}, {"t": 0, "q": "Was sollte man bei einem responsiven Formular prüfen?", "a": ["Ob Labels, Felder und Buttons ohne Überlappung bedienbar sind.", "Nur die Dateigröße des HTML.", "Nur die Farbe der Überschrift.", "Nur die Ansicht auf dem eigenen PC."], "e": "Responsive bedeutet auch gute Bedienbarkeit."}, {"t": 0, "q": "Was ist ein Breakpoint?", "a": ["Eine Grenze, ab der andere Layoutregeln gelten.", "Ein HTML-Fehler.", "Eine zusätzliche Webseite.", "Eine feste Anzahl an Bildern."], "e": "Ein Breakpoint markiert einen Layoutwechsel."}, {"t": 0, "q": "Wann ist ein Breakpoint sinnvoll gewählt?", "a": ["Wenn der Inhalt bei dieser Breite eine andere Anordnung braucht.", "Immer exakt bei 1000px.", "Wenn die HTML-Datei zu lang wird.", "Wenn JavaScript ausgeschaltet ist."], "e": "Der Platzbedarf des Inhalts ist entscheidend."}, {"t": 0, "q": "Was unterscheidet width:100% und max-width:100% bei einem kleinen Bild?", "a": ["width kann es vergrößern; max-width begrenzt nur nach oben.", "Beide erzwingen immer volle Breite.", "max-width verdoppelt die Auflösung.", "width erhält nie das Seitenverhältnis."], "e": "max-width allein zwingt ein kleines Bild nicht auf Containerbreite."}, {"t": 1, "q": "Basis: eine Spalte; min-width:700px: zwei Spalten. Wie viele bei 699px?", "a": ["Eine", "Zwei", "Drei", "Keine"], "e": "699px unterschreitet den Breakpoint."}, {"t": 1, "q": "Basis: eine Spalte; min-width:700px: zwei Spalten. Wie viele bei 900px?", "a": ["Zwei", "Eine", "Drei", "Keine"], "e": "900px erfüllt die Mindestbreite."}, {"t": 1, "q": "min-width:600px und danach min-width:1000px setzen jeweils dieselbe Eigenschaft am selben Selektor. Welche Regel gewinnt bei 1200px?", "a": ["Die spätere 1000px-Regel.", "Immer die 600px-Regel.", "Beide werden ignoriert.", "Die Basis gewinnt immer."], "e": "Beide Bedingungen stimmen; bei gleicher Priorität entscheidet die Reihenfolge."}, {"t": 1, "q": "Was trifft auf die Basisregeln bei Mobile First zu?", "a": ["Sie gelten zunächst auch auf großen Bildschirmen.", "Sie gelten nur unter 320px.", "Sie müssen vollständig überschrieben werden.", "Sie dürfen keine Farben enthalten."], "e": "Media Queries ändern gezielt einzelne Eigenschaften."}, {"t": 1, "q": "Welche CSS-Regel gilt bis einschließlich 600px?", "a": ["@media (max-width: 600px)", "@media (min-width: 600px)", "@width (600px)", "@media (width > 600px)"], "e": "max-width bedeutet höchstens diese Breite."}, {"t": 1, "q": "Wozu dient gap in einem Grid?", "a": ["Zum Abstand zwischen den Grid-Elementen.", "Zur Beschriftung von Feldern.", "Zur Anzahl der Radio-Gruppen.", "Zur Übertragung von Eingaben."], "e": "gap bestimmt Zwischenräume, nicht die äußere Breite."}, {"t": 1, "q": "Was bedeutet grid-template-columns: 1fr 1fr?", "a": ["Zwei gleich große flexible Spalten.", "Eine Spalte mit zwei Pixeln.", "Zwei Zeilen.", "Vier Spalten."], "e": "Beide Spalten erhalten denselben Anteil des verfügbaren Platzes."}, {"t": 1, "q": "Welche Reihenfolge ist für überlappende Mobile-First-Abfragen oft sinnvoll?", "a": ["Kleinere min-width zuerst, größere danach.", "Größere min-width immer zuerst.", "Alle Regeln in Zufallsreihenfolge.", "Keine Basisregeln verwenden."], "e": "Spätere Regeln können die vorigen bei größerer Breite gezielt erweitern."}, {"t": 2, "q": "Was legt method fest?", "a": ["Die HTTP-Methode der Übertragung.", "Die Eingabefarbe.", "Den Mindestwert.", "Die Schriftart."], "e": "Typische Methoden sind GET und POST."}, {"t": 2, "q": "Was ist ein sinnvoller Absende-Button?", "a": ["<button type=\"submit\">Senden</button>", "<button type=\"email\">Senden</button>", "<input type=\"label\">", "<submit>Senden</submit>"], "e": "submit löst die reguläre Formularübermittlung aus."}, {"t": 2, "q": "Welches Feld passt zu einer E-Mail-Adresse?", "a": ["<input type=\"email\">", "<input type=\"mailtext\">", "<email>", "<textarea type=\"radio\">"], "e": "email ist ein gültiger Eingabetyp."}, {"t": 2, "q": "Welcher Fehler steckt in label for=\"alter\" und input id=\"jahre\"?", "a": ["Das Label verweist auf eine andere Kennung.", "number darf keine id besitzen.", "for muss immer leer sein.", "Labels sind nur bei Textfeldern erlaubt."], "e": "for und id müssen für diese Verknüpfung übereinstimmen."}, {"t": 2, "q": "Warum reicht ein Platzhalter als Beschriftung nicht aus?", "a": ["Er verschwindet beim Eingeben und ist kein dauerhafter Label-Ersatz.", "Er wird automatisch zum Absende-Button.", "Er verschlüsselt die Eingabe.", "Er verhindert jede Eingabe."], "e": "Ein sichtbares Label benennt das Feld dauerhaft."}, {"t": 2, "q": "Zwei Felder besitzen dieselbe id. Was ist daran problematisch?", "a": ["Die Kennung ist nicht mehr eindeutig.", "Beide werden automatisch zusammenaddiert.", "Sie werden zur Radio-Gruppe.", "Das Formular wird automatisch gelöscht."], "e": "Jede id sollte im Dokument eindeutig sein."}, {"t": 2, "q": "Welches Attribut begrenzt eine Zahl nach oben?", "a": ["max", "min", "required", "placeholder"], "e": "max=\"100\" setzt die obere Grenze auf 100."}, {"t": 2, "q": "Welche Zeile erzeugt eine Pflichtzahl von mindestens 1?", "a": ["<input type=\"number\" min=\"1\" required>", "<input type=\"text\" max=\"1\">", "<input type=\"number\" placeholder=\"1\">", "<input type=\"number\" value=\"1\">"], "e": "min legt die Untergrenze fest, required fordert eine Eingabe."}, {"t": 3, "q": "Welche Eingabe passt zu mehreren unabhängigen Zusatzwünschen?", "a": ["Checkboxen", "Eine gemeinsame Radio-Gruppe", "Ein Submit-Button", "Ein Label ohne Feld"], "e": "Checkboxen erlauben mehrere gleichzeitig ausgewählte Optionen."}, {"t": 3, "q": "Was gehört in ein select-Element?", "a": ["option-Elemente", "Nur CSS-Regeln", "Mehrere form-Elemente", "Nur Kommentare"], "e": "option definiert eine Auswahlmöglichkeit."}, {"t": 3, "q": "Was bewirkt value=\"gross\" bei einer ausgewählten Option?", "a": ["Dieser Wert wird als Auswahlwert verwendet.", "Das Feld wird automatisch groß dargestellt.", "Das Label verschwindet.", "Die CSS-Breite wird 100%."], "e": "Angezeigter Text und übertragener Wert können unterschiedlich sein."}, {"t": 3, "q": "Wie schreibt man einen HTML-Kommentar?", "a": ["<!-- Erklärung -->", "/* Erklärung */", "// Erklärung", "<note>Erklärung</note>"], "e": "HTML-Kommentare stehen zwischen <!-- und -->."}, {"t": 3, "q": "Was ist Padding?", "a": ["Innenabstand zwischen Inhalt und Rand.", "Abstand zwischen zwei Dateien.", "Eine Formularmethode.", "Eine Schleifenbedingung."], "e": "Padding gehört zum Boxmodell."}, {"t": 3, "q": "Welche CSS-Regel wählt nur Radio-Inputs aus?", "a": ["input[type=\"radio\"]", "input.radio()", "radio.input", "#type=radio"], "e": "Ein Attributselektor filtert nach dem Wert des type-Attributs."}, {"t": 3, "q": "Warum ist width:100% für Radiofelder oft ungeeignet?", "a": ["Die Auswahlpunkte sollen nicht die volle Zeilenbreite einnehmen.", "Radiofelder benötigen 1000px.", "Dann wird das Formular verschlüsselt.", "Es macht aus Radiofeldern Textfelder."], "e": "Eine Ausnahme mit width:auto lässt Radios kompakt."}, {"t": 3, "q": "Was trennt eine CSS-Eigenschaft von ihrem Wert?", "a": ["Ein Doppelpunkt", "Ein Gleichheitszeichen", "Ein HTML-Tag", "Ein Komma"], "e": "Beispiel: padding: 12px;."}, {"t": 4, "q": "Welche Eigenschaft betrifft die Durchführbarkeit einzelner Schritte?", "a": ["Ausführbarkeit", "Determinismus", "Terminierung", "Determiniertheit"], "e": "Jeder verlangte Schritt muss tatsächlich ausführbar sein."}, {"t": 4, "q": "Was meint Finitheit hier?", "a": ["Die Beschreibung umfasst endlich viele Anweisungen.", "Jede Ausführung dauert genau eine Sekunde.", "Es gibt keine Wiederholungen.", "Jede Eingabe ist eine Zahl."], "e": "Eine endliche Beschreibung kann eine Schleife enthalten."}, {"t": 4, "q": "Was ist ein Programm im Verhältnis zum Algorithmus?", "a": ["Eine Umsetzung in einer Programmiersprache.", "Immer dieselbe Sache wie ein Struktogramm.", "Eine beliebige Sammlung von Bildern.", "Nur die Ausgabe des Algorithmus."], "e": "Ein Ablauf lässt sich in verschiedenen Sprachen umsetzen."}, {"t": 4, "q": "Was ist beim Durchschnittsalgorithmus die Verarbeitung?", "a": ["Summe bilden und durch die Anzahl teilen.", "Nur Zahlen eingeben.", "Nur das Ergebnis anzeigen.", "Nur den Programmnamen wählen."], "e": "Eingabe, Berechnung und Ausgabe haben unterschiedliche Aufgaben."}, {"t": 4, "q": "Wann endet die Schleife „solange x > 0“ mit x=x-1, Start x=3?", "a": ["Nachdem x auf 0 verringert wurde.", "Erst bei x=-1.", "Schon vor der ersten Ausführung.", "Sie endet niemals."], "e": "Bei x=0 ist x>0 falsch."}, {"t": 4, "q": "Welche Anweisung ist am eindeutigsten?", "a": ["Erhöhe x um 1.", "Mach x etwas größer.", "Verbessere x irgendwie.", "Verändere etwas."], "e": "Eine feste Rechenoperation ist eindeutig ausführbar."}, {"t": 4, "q": "Warum kann man einen Algorithmus als Diagramm darstellen?", "a": ["Der Ablauf ist unabhängig von einer konkreten Programmiersprache.", "Weil Diagramme automatisch Maschinenprogramme sind.", "Weil damit keine Bedingungen mehr nötig sind.", "Weil alle Diagramme dasselbe Ergebnis liefern."], "e": "Die Darstellung beschreibt die Logik."}, {"t": 4, "q": "Ein Verfahren liefert für identische Eingaben verschiedene Ergebnisse. Welche Eigenschaft fehlt?", "a": ["Determiniertheit", "Zwingend die Finitheit", "Zwingend die Ausführbarkeit", "Zwingend die Terminierung"], "e": "Determiniertheit bezieht sich auf die Übereinstimmung des Ergebnisses."}, {"t": 5, "q": "x=5; solange x<3: x=x+1. Welchen Wert hat x danach?", "a": ["5", "6", "3", "0"], "e": "Die Bedingung ist sofort falsch, der Körper läuft nicht."}, {"t": 5, "q": "x=5; wiederhole x=x+1, solange x<3. Welchen Wert hat x danach?", "a": ["6", "5", "3", "0"], "e": "Die fußgesteuerte Schleife führt den Körper einmal aus."}, {"t": 5, "q": "summe=0; addiere nacheinander 1, 2 und 3. Ergebnis?", "a": ["6", "3", "5", "123"], "e": "0+1+2+3 ergibt 6."}, {"t": 5, "q": "Welche Struktur passt zur Auswahl einer von vier Kaffeesorten?", "a": ["Mehrfachauswahl", "Nur Sequenz", "Zwingend eine Endlosschleife", "Nur ein Funktionsaufruf ohne Auswahl"], "e": "Es gibt mehrere mögliche Fälle."}, {"t": 5, "q": "Bei „wiederhole bis korrekt“ wird beendet, wenn …", "a": ["korrekt wahr ist.", "korrekt falsch ist.", "immer genau zwei Durchläufe erfolgt sind.", "die Schleife noch nicht begonnen hat."], "e": "Die bis-Bedingung ist eine Abbruchbedingung."}, {"t": 5, "q": "Welche Schleife passt zu „genau zehnmal ausführen“?", "a": ["Zählergesteuerte Schleife", "Nur eine Alternative", "Unbegrenzte Wiederholung", "Eine Sequenz mit einer Anweisung"], "e": "Die Wiederholungszahl ist bekannt."}, {"t": 5, "q": "Was ist eine verschachtelte Alternative?", "a": ["Eine Fallunterscheidung innerhalb eines Zweigs einer anderen.", "Zwei beliebige Ausgaben untereinander.", "Eine Schleife ohne Körper.", "Eine Alternative ohne Bedingung."], "e": "Beispiel: Süßungsmittel nur im Ja-Zweig von Süßen wählen."}, {"t": 5, "q": "i=0; solange i<3: i=i+1; Ausgabe i. Was erscheint?", "a": ["1, 2, 3", "0, 1, 2", "0, 1, 2, 3", "Nur 3"], "e": "Hier wird zuerst erhöht, danach ausgegeben."}, {"t": 6, "q": "Welches PAP-Symbol passt zur Eingabe einer Zahl?", "a": ["Parallelogramm", "Raute", "Abgerundetes Endsymbol", "Verbindungspfeil"], "e": "Das Parallelogramm kennzeichnet Ein- und Ausgaben."}, {"t": 6, "q": "Was zeigen Pfeile im PAP?", "a": ["Die Richtung des Ablaufs.", "Immer Datenbankbeziehungen.", "Die Größe einer Zahl.", "Die Anzahl der Variablen."], "e": "Sie verbinden die Verarbeitungsschritte in der richtigen Reihenfolge."}, {"t": 6, "q": "Wo stehen aufeinanderfolgende Anweisungen im Struktogramm?", "a": ["Untereinander", "Immer nebeneinander", "Außerhalb aller Blöcke", "In Kreisen"], "e": "Von oben nach unten wird die Sequenz gelesen."}, {"t": 6, "q": "Wie erkennt man den Schleifenkörper im Struktogramm?", "a": ["Er ist vom Schleifenblock umschlossen.", "Er ist immer rot.", "Er liegt außerhalb des Diagramms.", "Er braucht einen Rückpfeil."], "e": "Die Verschachtelung stellt die Zugehörigkeit dar."}, {"t": 6, "q": "Warum sollten Ja und Nein an PAP-Zweigen stehen?", "a": ["Damit die Auswahlwege eindeutig sind.", "Damit zwei Zweige gleichzeitig ausgeführt werden.", "Damit keine Bedingung mehr nötig ist.", "Damit die Datei kleiner wird."], "e": "Die Beschriftung ordnet die Wege dem Bedingungsergebnis zu."}, {"t": 6, "q": "Was folgt nach einer Alternative, wenn beide Zweige fertig sind?", "a": ["Der gemeinsame weitere Ablauf.", "Immer automatisch Programmende.", "Immer der andere Zweig.", "Immer eine neue Eingabe."], "e": "Die Zweige werden zum folgenden Schritt zusammengeführt."}, {"t": 6, "q": "Welches Symbol ist für Start/Ende typisch?", "a": ["Ein abgerundetes Symbol", "Eine Entscheidungsraute", "Eine Kommentarzeile", "Ein offener Pfeil ohne Ziel"], "e": "Start und Ende begrenzen den Ablauf."}, {"t": 6, "q": "Was bedeutet Top-down-Entwurf im PAP-Blatt?", "a": ["Eine Gesamtaufgabe schrittweise in kleinere Teilaufgaben zerlegen.", "Zuerst Farben und dann Inhalte festlegen.", "Zufällig mit einem Detail beginnen.", "Den Algorithmus rückwärts ausführen."], "e": "Man verfeinert vom allgemeinen Problem bis zu konkreten Schritten."}, {"t": 7, "q": "Geheimzahl 42, Tipp 17: Welcher Hinweis?", "a": ["Zu klein", "Zu groß", "Gefunden", "Ungültig, weil unter 42"], "e": "17 liegt unter der Geheimzahl."}, {"t": 7, "q": "Geheimzahl und erster Tipp sind gleich. Wie oft läuft der Körper der Ungleich-Schleife?", "a": ["0-mal", "1-mal", "2-mal", "Unendlich oft"], "e": "Die Kopfbedingung ist sofort falsch."}, {"t": 7, "q": "10 Saftkisten kosten je 8 €, 11 je 7 €. Warum kann 11 günstiger sein als 10?", "a": ["Der neue Stückpreis gilt hier für alle Kisten.", "Die elfte Kiste ist negativ teuer.", "Es wird nur eine Kiste bezahlt.", "Der erste Preis gilt auch bei 11."], "e": "10·8=80 und 11·7=77. Das folgt aus dem Mengentarif der Aufgabe."}, {"t": 7, "q": "Was ist der Gesamtpreis für 1000 Saftkisten laut Mappe?", "a": ["6000 €", "5000 €", "7000 €", "1000 €"], "e": "Bis einschließlich 1000 kostet jede Kiste 6 €."}, {"t": 7, "q": "8 Arbeitsstunden zu 15 € pro Stunde ergeben welchen Bruttolohn?", "a": ["120 €", "23 €", "1,875 €", "150 €"], "e": "Bruttolohn = Stunden · Stundenlohn."}, {"t": 7, "q": "Warum setzt man die Lohnsumme vor der Schleife auf 0?", "a": ["Damit die Addition mit einem definierten Startwert beginnt.", "Damit jeder Lohn 0 bleibt.", "Damit nur ein Mitarbeiter gezählt wird.", "Damit die Ausgabe zuerst erfolgt."], "e": "Innerhalb der Schleife wird jeder weitere Lohn addiert."}, {"t": 7, "q": "Was passiert, wenn summe=0 in jedem Mitarbeiterdurchlauf steht?", "a": ["Frühere Löhne gehen in der Summe verloren.", "Alle Löhne werden korrekt summiert.", "Die Schleife läuft schneller und bleibt korrekt.", "Es entstehen automatisch Durchschnittslöhne."], "e": "Das Zurücksetzen löscht die vorher aufsummierten Werte."}, {"t": 7, "q": "Beim Kaffeeverkauf wird Süßen abgelehnt. Was folgt nach diesem Auswahlblock?", "a": ["Die Aufforderung zur Zahlung.", "Trotzdem die Süßstoffauswahl.", "Ein erneuter Start ohne Becher.", "Zwingend eine andere Kaffeesorte."], "e": "Der Nein-Zweig bleibt leer und führt zum gemeinsamen Folgeschritt."}], "exercises": [{"title": "Mobile First umbauen", "topic": 1, "kind": "code", "prompt": "Baue das CSS auf Mobile First um: unter 768px eine Spalte, ab 768px zwei Spalten. Abstand immer 16px. Erhalte das Verhalten, vermeide doppelte Regeln.", "starter": ".karten {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 16px;\n}\n@media (max-width: 767px) {\n  .karten { grid-template-columns: 1fr; }\n}", "solution": ".karten { display: grid; grid-template-columns: 1fr; gap: 16px; }\n@media (min-width: 768px) {\n  .karten { grid-template-columns: 1fr 1fr; }\n}", "checks": ["Basislayout mit einer Spalte", "min-width: 768px für zwei Spalten", "Gemeinsame Regeln nur einmal"]}, {"title": "Ein Formular ergänzen", "topic": 2, "kind": "code", "prompt": "Ergänze ein Pflichtfeld für das Alter (Zahl, mindestens 0), ein passendes Label und einen Absende-Button. name soll alter heißen. Kommentiere das Eingabefeld.", "starter": "<form action=\"auswertung.php\" method=\"post\">\n  <!-- Hier ergänzen -->\n</form>", "solution": "<form action=\"auswertung.php\" method=\"post\">\n  <label for=\"alter\">Alter</label>\n  <!-- Pflichtfeld: Zahl ab 0 -->\n  <input type=\"number\" id=\"alter\" name=\"alter\" min=\"0\" required>\n  <button type=\"submit\">Senden</button>\n</form>", "checks": ["label for und input id stimmen überein", "number, name=\"alter\", min=\"0\", required", "submit-Button und sinnvoller Kommentar"]}, {"title": "Code erklären", "topic": 2, "kind": "text", "prompt": "Erkläre jedes Attribut dieser Zeile und die Verbindung zum Label:\n<label for=\"mail\">E-Mail</label>\n<input type=\"email\" id=\"mail\" name=\"emailadresse\" required>", "solution": "type=\"email\": Feld für eine E-Mail-Adresse. id=\"mail\": eindeutige Kennung und Ziel des Labels. name=\"emailadresse\": Schlüssel bei der Übermittlung. required: Pflichtfeld. for=\"mail\" verbindet die Beschriftung mit der id.", "checks": ["type, id, name und required erklärt", "for/id-Verbindung genannt", "id und name nicht verwechselt"]}, {"title": "Kaffeeverkauf zeichnen", "topic": 7, "kind": "draw", "prompt": "Zeichne ein Struktogramm: Größe normal/groß, danach Kaffeesorte (Kaffee, Espresso, Latte Macchiato, Cappuccino). Anschließend Süßen ja/nein. Nur bei Ja: Zucker/Süßstoff wählen. Zum Schluss zur Zahlung auffordern.", "solution": "Größenauswahl → passende Becherwahl → Mehrfachauswahl Kaffeesorte und Zubereitung → Alternative „Süßen?“ mit verschachtelter Auswahl „Zucker/Süßstoff“ im Ja-Zweig und leerem Nein-Zweig → Zahlung außerhalb der Alternative.", "checks": ["Größe und Kaffeesorte nacheinander", "Süßungsmittel nur innerhalb des Ja-Zweigs", "Zahlung nach Zusammenführung aller Zweige"]}, {"title": "Zahlenraten korrigieren", "topic": 7, "kind": "draw", "prompt": "Entwirf einen PAP zum Zahlenraten. Geheimzahl 1–100. Tipp eingeben; solange falsch, „zu klein“ oder „zu groß“ ausgeben und neuen Tipp lesen. Bei Treffer beenden. Achte auf die Vergleichsrichtung.", "solution": "Start → Geheimzahl bestimmen → Tipp lesen → Tipp ≠ Geheimzahl? Nein: „Zahl gefunden“ → Ende. Ja: Tipp < Geheimzahl? Ja: „Zu klein“, Nein: „Zu groß“. Danach neuer Tipp und zurück zur Schleifenprüfung.", "checks": ["Schleifentest vor dem Körper", "Korrekte Hinweise relativ zum Tipp", "Neuer Tipp und Rückführung", "Erfolg außerhalb der Schleife"]}, {"title": "Apfelsaft: Grenzwerte", "topic": 7, "kind": "text", "prompt": "Aus der Mappe: 1–10 Kisten je 8 €, 11–99 je 7 €, 100–1000 je 6 €, ab 1001 je 5 €. Bestimme Gesamtpreise für 10, 11, 99, 100 und 1001 Kisten. Beschreibe anschließend die Fallauswahl.", "solution": "10: 80 €; 11: 77 €; 99: 693 €; 100: 600 €; 1001: 5005 €. Für positive ganze Anzahl n: wenn n≤10, p=8; sonst wenn n≤99, p=7; sonst wenn n≤1000, p=6; sonst p=5. Gesamt=n·p. Ungültige Eingaben gesondert ablehnen.", "checks": ["Alle fünf Gesamtpreise korrekt", "Grenzen ohne Lücken/Überschneidungen", "Preis pro Kiste mit Gesamtmenge multipliziert"]}, {"title": "Bruttolöhne aufsummieren", "topic": 7, "kind": "draw", "prompt": "Wie im PAP-Blatt: Personalnummer, Stunden und Stundenlohn für mindestens einen Mitarbeiter eingeben. Bruttolohn berechnen und aufsummieren. Nach jedem Datensatz fragen: „Ende der Eingaben (J/N)?“ Bei N fortfahren. Zum Schluss Datensätze und Gesamtsumme ausgeben. Entwirf ein Struktogramm.", "solution": "summe=0; Liste leeren. Wiederhole: Personalnummer, Stunden, Stundenlohn lesen; lohn=Stunden·Stundenlohn; Datensatz speichern; summe=summe+lohn; Ende (J/N) lesen. Solange Antwort=N. Danach Liste und summe ausgeben. Die Schleife ist fußgesteuert.", "checks": ["Summe vor der Schleife auf 0 gesetzt", "Lohnberechnung und Addition in der Schleife", "Fußgesteuert, bei N wiederholen", "Daten aufbewahren und abschließend ausgeben"]}, {"title": "Algorithmus prüfen", "topic": 4, "kind": "text", "prompt": "Ein Ablauf lautet: x=1; solange x>0: Ausgabe x. Erkläre Finitheit und Terminierung an diesem Beispiel. Wie könnte man ihn sinnvoll verändern?", "solution": "Die Beschreibung ist endlich, der Ablauf terminiert aber nicht: x bleibt 1 und x>0 immer wahr. Eine Änderung wäre x=x-1 im Schleifenkörper. Dann wird einmal 1 ausgegeben und anschließend endet die Schleife.", "checks": ["Endliche Beschreibung erkannt", "Endlosschleife mit unverändertem x erklärt", "Sinnvolle Änderung vorgeschlagen"]}, {"title": "Formularfehler finden", "topic": 3, "kind": "code", "prompt": "Repariere das Label und ergänze name. Beide Radiofelder sollen zusammen eine Auswahl bilden. Danach CSS ergänzen: Textfeld volle Breite inklusive Padding, Radios automatische Breite.", "starter": "<label for=\"nutzer\">Name</label>\n<input id=\"person\" type=\"text\">\n<label><input type=\"radio\" name=\"klein\" value=\"normal\">Normal</label>\n<label><input type=\"radio\" name=\"gross\" value=\"gross\">Groß</label>", "solution": "<label for=\"person\">Name</label>\n<input id=\"person\" name=\"person\" type=\"text\">\n<label><input type=\"radio\" name=\"groesse\" value=\"normal\">Normal</label>\n<label><input type=\"radio\" name=\"groesse\" value=\"gross\">Groß</label>\n<style>\ninput { box-sizing: border-box; width: 100%; padding: 12px; }\ninput[type=\"radio\"] { width: auto; }\n</style>", "checks": ["Label zeigt auf passende id", "Textfeld mit name", "Radios haben gleichen name", "CSS trennt Radios von Textfeldern"]}]};

function home(){show(`<div class="hero"><div><div class="eyebrow">BG24 · Deine Klausurvorbereitung</div><h1>Verstehen.<br>Ausprobieren.<br><span style="color:var(--accent)">Sicher werden.</span></h1><p>Von Mobile First bis zur Schleife. Übe genau die Themen deiner Checkliste – in deinem Tempo.</p><div class="row"><button class="primary" onclick="nav(2)">Schnelltest starten ↗</button><button onclick="nav(1)">Themen ansehen</button></div></div><div class="hero-art"><svg viewBox="0 0 340 250" aria-label="Dekorative Verzweigung"><g fill="none" stroke="#76915d" stroke-width="1.5"><path d="M170 30V65 M110 105H50V160 M230 105H290V160 M50 200V225H290V200 M170 225V245"/><path d="M170 60L240 105L170 150L100 105Z" fill="#263522"/><rect x="9" y="160" width="82" height="40" rx="8"/><rect x="249" y="160" width="82" height="40" rx="8"/></g><g fill="#c2f178" text-anchor="middle" font-family="monospace" font-size="13"><text x="170" y="25">START</text><text x="170" y="108">verstanden?</text><text x="50" y="149">ja</text><text x="290" y="149">noch nicht</text><text x="50" y="185">üben</text><text x="290" y="185">lernen</text></g></svg></div></div><div class="row" style="margin-bottom:24px"><span class="pill">96 Quizfragen</span><button onclick="nav(6)">Neu: Code & Ablauf trainieren →</button><button onclick="nav(7)">Meine Schwächen</button></div><div class="stats"><div><strong>${state.done.length}/8</strong><span>Kapitel abgehakt</span></div><div><strong>${state.attempts?Math.round(state.correct/state.attempts*100):0}%</strong><span>Quiz richtig · ${state.attempts} Antworten</span></div><div><strong>${state.wrong.length}</strong><span>Zum Wiederholen</span></div></div><div class="sectionhead"><h2>Dein Lernpfad</h2><span class="pill">Alle Klausurthemen</span></div><div class="grid">${DATA.lessons.map((l,i)=>`<button class="card topic" onclick="lesson=${i};nav(1)"><span class="num">0${i+1} ${state.done.includes(i)?' / erledigt':''}</span><h3>${l.title}</h3><p>${l.sub}</p><span class="foot"><span>${i<4?'HTML & CSS':'Algorithmen'}</span><span>↗</span></span></button>`).join('')}</div><div class="card sources" style="margin-top:24px"><h3>Worauf die Website basiert</h3><p>Dein Screenshot bestimmt den Umfang. „PAP.pdf“ liefert Kontrollstrukturen und die Aufgaben Kaffee, Zahlenraten, Apfelsaft und Bruttolöhne. „Aufgabe 1“ und „Aufgabe 2“ liefern die Diagrammbeispiele. Übungen sind teilweise neu formuliert; Musterlösungen sind selbst erstellt.</p><p>Die Zahlenraten-Vorlage enthält vertauschte Hinweise und eine unerreichbare Gleichheitsprüfung innerhalb der Ungleich-Schleife. Hier ist der Ablauf korrigiert. HTML/CSS ist passend zur Checkliste ergänzt.</p><div class="row"><a href="https://studyflix.de/informatik/algorithmus-4244" target="_blank" rel="noopener">Studyflix: Algorithmus ↗</a><a href="https://developer.mozilla.org/de/docs/Learn_web_development/Core/CSS_layout/Media_queries" target="_blank" rel="noopener">MDN: Media Queries ↗</a><a href="https://developer.mozilla.org/en-US/docs/Learn_web_development/Extensions/Forms/Your_first_form" target="_blank" rel="noopener">MDN: Formulare ↗</a></div><details><summary>Hinweise zur Nutzung</summary><p>Du brauchst nur diese Datei. Herunterladen und im Browser öffnen. Für GitHub Pages heißt sie bereits index.html. Keine Anmeldung, keine externen Bibliotheken. Nur die Quellenlinks benötigen Internet. Freie Texte und Zeichnungen vergleichst du selbst mit der Musterlösung; sie werden nicht automatisch benotet.</p></details><button class="quiet" onclick="resetProgress()">Lernfortschritt zurücksetzen</button></div>`)}

function answer(a){if(answered)return;answered=true;const id=quiz[qi],q=DATA.questions[id],right=a===0;if(right){points++;state.correct++;state.wrong=state.wrong.filter(x=>x!==id)}else if(!state.wrong.includes(id))state.wrong.push(id);state.attempts++;state.qstats=state.qstats||{};let st=state.qstats[id]||(state.qstats[id]={tries:0,hits:0});st.tries++;if(right)st.hits++;save();document.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;if(+b.dataset.answer===0)b.classList.add('good');else if(+b.dataset.answer===a)b.classList.add('bad')});$('#feedback').innerHTML=`<div class="feedback"><strong>${right?'Richtig.':'Noch nicht ganz.'}</strong><p style="margin:8px 0">${esc(q.e)}</p><button class="primary" onclick="qi++;quizQuestion()">${qi+1===quiz.length?'Ergebnis ansehen':'Nächste Frage →'}</button></div>`}

function workshop(){let x=DATA.exercises[exercise];show(`<div class="sectionhead"><div><div class="eyebrow">Wissen anwenden</div><h2>Die Werkstatt</h2></div><span class="pill">${DATA.exercises.length} Aufgaben</span></div><label for="exercise">Aufgabe wählen</label><select id="exercise">${DATA.exercises.map((x,i)=>`<option value="${i}" ${i===exercise?'selected':''}>${i+1}. ${x.title}</option>`).join('')}</select><div class="card exercise"><span class="pill">${DATA.lessons[x.topic].title}</span><h2 style="margin-top:18px">${x.title}</h2><p style="white-space:pre-line">${esc(x.prompt)}</p><label for="response">${x.kind==='code'?'Dein Code':'Deine Antwort / Ablaufbeschreibung'}</label><textarea id="response" class="${x.kind==='code'?'editor':''}" spellcheck="false">${esc(state.notes['work'+exercise]??x.starter??'')}</textarea>${x.kind==='code'?'<div class="row"><button id="previewBtn">HTML/CSS-Vorschau</button><span class="small">Isoliert, ohne JavaScript oder Formularübertragung.</span></div><iframe id="preview" title="Vorschau deines Codes" sandbox="" class="hidden"></iframe>':''}${x.kind==='draw'?'<details><summary>Zeichenfeld öffnen</summary><p class="small">Mit Finger, Stift oder Maus. Skizze wird lokal gespeichert, falls dein Browser das erlaubt.</p><canvas class="canvas" id="canvas" width="1000" height="500" aria-label="Zeichenfeld"></canvas><div class="row" style="margin-top:10px"><button id="clearCanvas">Zeichnung löschen</button><span class="small">Für präzise Diagramme kannst du auch Papier verwenden.</span></div></details>':''}<details><summary>Musterlösung & Selbstkontrolle</summary><pre>${esc(x.solution)}</pre>${x.checks.map((c,i)=>`<label class="check"><input type="checkbox">${esc(c)}</label>`).join('')}<p class="small">Prüfe die Bedeutung, nicht den exakten Wortlaut. Gleichwertige Lösungen sind möglich.</p></details></div>`);$('#exercise').onchange=e=>{exercise=+e.target.value;workshop()};$('#response').oninput=e=>{state.notes['work'+exercise]=e.target.value;save()};if($('#previewBtn'))$('#previewBtn').onclick=()=>{let v=$('#response').value;$('#preview').classList.remove('hidden');$('#preview').srcdoc='<!DOCTYPE html><meta name="viewport" content="width=device-width"><style>body{font:16px system-ui;padding:16px}input,button,select,textarea{font:inherit;max-width:100%}</style>'+(exercise===0?'<style>'+v+'</style><div class="karten"><div>Inhalt 1</div><div>Inhalt 2</div><div>Inhalt 3</div></div>':v)};if($('#canvas'))setupCanvas()}
function setupCanvas(){const c=$('#canvas'),ctx=c.getContext('2d'),key='drawing'+exercise;ctx.lineWidth=2.5;ctx.lineCap='round';ctx.strokeStyle='#17251c';if(state.notes[key]){let im=new Image;im.onload=()=>ctx.drawImage(im,0,0);im.src=state.notes[key]}let drawing=false;const xy=e=>{let r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};c.onpointerdown=e=>{drawing=true;c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...xy(e))};c.onpointermove=e=>{if(drawing){ctx.lineTo(...xy(e));ctx.stroke()}};const stop=()=>{if(!drawing)return;drawing=false;state.notes[key]=c.toDataURL();save()};c.onpointerup=stop;c.onpointercancel=stop;$('#clearCanvas').onclick=()=>{if(confirm('Diese Zeichnung löschen?')){ctx.clearRect(0,0,c.width,c.height);delete state.notes[key];save()}}}
const examTasks=[{title:'Responsive & Mobile First',points:6,prompt:'Definiere Responsive Webdesign. Vergleiche Mobile First und Desktop First. Schreibe CSS für .layout: zunächst eine Spalte, ab 800px zwei gleich breite Spalten.',solution:'Responsive: Anpassung von Layout/Inhalten an verfügbaren Platz (2 P). Mobile First: kleine Basis und Erweiterung; Desktop First: große Basis und Anpassung nach unten (2 P). .layout { display:grid; grid-template-columns:1fr; } @media(min-width:800px) { .layout { grid-template-columns:1fr 1fr; } } (2 P).'}, {title:'HTML-Formular',points:8,prompt:'Schreibe ein Formular mit action="anmeldung.php" und method="post". Enthalten sein sollen ein beschriftetes Pflichtfeld für eine E-Mail-Adresse und ein Absende-Button. Erkläre id, name und die Verbindung zum label.',solution:'form mit korrekter action/method (2 P); label for="mail" und input id="mail" (1 P); type="email", name="email", required (2 P); button type="submit" (1 P); id identifiziert und verbindet das Label, name ist der Übertragungsschlüssel (2 P).'}, {title:'Algorithmus & Eigenschaften',points:6,prompt:'Definiere Algorithmus. Unterscheide Determinismus und Determiniertheit. Erkläre an einer Endlosschleife den Unterschied zwischen Finitheit und Terminierung.',solution:'Eindeutige Schrittfolge zur Problemlösung (2 P). Determinismus: eindeutiger Folgeschritt; Determiniertheit: gleiches Ergebnis bei gleichen Eingaben (2 P). Endlich beschreibbar bedeutet nicht, dass die Ausführung endet; unverändert wahre Schleifenbedingung als Beispiel (2 P).'}, {title:'Kontrollstrukturen',points:4,prompt:'Erkläre kopf- und fußgesteuerte Schleifen einschließlich minimaler Durchlaufzahl. Nenne den grundlegenden Unterschied zwischen PAP und Struktogramm.',solution:'Kopfgesteuert: Prüfung vorher, mindestens 0 Durchläufe (1 P). Fußgesteuert: Prüfung nachher, mindestens 1 (1 P). PAP: Symbole mit Ablaufpfeilen; Struktogramm: verschachtelte Blöcke ohne Ablaufpfeile (2 P).'}, {title:'PAP entwerfen',points:6,prompt:'Zeichne auf Papier einen PAP: Eine Geheimzahl von 1 bis 100 wird festgelegt. Tipps werden eingegeben, bis einer stimmt. Bei falschen Tipps passende Hinweise und neue Eingabe, bei Treffer Erfolg ausgeben. Beschreibe hier zusätzlich deinen Ablauf.',solution:'Start, Geheimzahl, erste Eingabe (1 P). Test Tipp≠Geheimzahl vor Körper (1 P). Tipp<Geheimzahl → zu klein; sonst zu groß (1 P). Neue Eingabe und Rückführung (1 P). Erfolg nach Schleife, Ende (1 P). Sinnvolle Symbole und beschriftete Zweige (1 P).'}];
function exam(){clearInterval(ticker);if(!examActive&&!examDone){show(`<div class="narrow card"><div class="eyebrow">Generalprobe</div><h2>30 Minuten. Fünf Aufgaben.</h2><p>30 mögliche Punkte, alle Themenbereiche. Schreibe frei und zeichne den PAP auf Papier. Die Lösungen erscheinen erst nach der Abgabe. Der Timer ist eine Orientierung, keine automatische Abgabe.</p><p class="small">Eigene Übungsklausur passend zur Checkliste, keine Vorhersage deiner echten Arbeit. Bewertung per Selbstkontrolle.</p><button class="primary" onclick="startExam()">Klausur starten</button></div>`);return}show(`<div class="sectionhead"><h2>${examDone?'Deine Auswertung':'Übungsklausur'}</h2><span class="pill" id="timer">${examDone?'Selbstkontrolle':'30:00'}</span></div>${examTasks.map((x,i)=>`<div class="card" style="margin-bottom:18px"><span class="small">Aufgabe ${i+1} · ${x.points} Punkte</span><h3>${x.title}</h3><p>${esc(x.prompt)}</p><label for="exam${i}">Deine Antwort</label><textarea id="exam${i}" data-exam="${i}" ${examDone?'readonly':''}>${esc(state.notes['exam'+i]||'')}</textarea>${examDone?`<div class="feedback"><strong>Erwartungshorizont</strong><p>${esc(x.solution)}</p><label for="score${i}">Erreichte Punkte (0–${x.points})</label><input id="score${i}" data-score="${i}" type="number" min="0" max="${x.points}" step="1" value="0"></div>`:''}</div>`).join('')}<div class="card">${examDone?'<h2 id="examTotal">0 / 30 Punkte</h2><p>Orientierung durch deine eigene Bewertung; keine offizielle Note.</p><button onclick="examDone=false;exam();">Zur Startseite der Klausur</button>':'<button class="primary" onclick="finishExam()">Abgeben & Lösungen zeigen</button><p class="small">Antworten werden in diesem Browser gespeichert. Bei Verlassen dieses Tabs läuft der Timer weiter; ein Neuladen beendet die laufende Zeitmessung.</p>'}</div>`);document.querySelectorAll('[data-exam]').forEach(el=>el.oninput=()=>{state.notes['exam'+el.dataset.exam]=el.value;save()});document.querySelectorAll('[data-score]').forEach(el=>el.oninput=()=>{let total=0;document.querySelectorAll('[data-score]').forEach(s=>{total+=Math.min(+s.max,Math.max(0,Math.floor(+s.value||0)))});$('#examTotal').textContent=total+' / 30 Punkte'});if(examActive){updateTimer();ticker=setInterval(updateTimer,1000)}}

function startQuiz(filter){let ids=DATA.questions.map((q,i)=>i).filter(i=>filter==='all'||filter==='weak'||(filter==='wrong'?state.wrong.includes(i):filter==='book'?(state.bookmarks||[]).includes(i):DATA.questions[i].t===+filter));ids=shuffle(ids);if(filter==='weak')ids.sort((a,b)=>priority(b)-priority(a));quiz=ids.slice(0,quizLimit);qi=0;points=0;quizQuestion()}

function progressView(){let stats=DATA.lessons.map((l,t)=>{let ids=DATA.questions.map((q,i)=>i).filter(i=>DATA.questions[i].t===t);let tried=ids.filter(i=>state.qstats?.[i]);let tries=0,hits=0;tried.forEach(i=>{tries+=state.qstats[i].tries;hits+=state.qstats[i].hits});return{t,title:l.title,tries,hits,seen:tried.length,total:ids.length,pct:tries?Math.round(hits/tries*100):null}});show(`<div class="sectionhead"><div><div class="eyebrow">Gezielt weiterlernen</div><h2>Was sitzt, was fehlt?</h2></div><button class="primary" onclick="current=2;renderNav();quizLimit=10;startQuiz('weak')">Schwächenrunde starten</button></div><p>Trefferquoten je Thema werden ab dieser Version erfasst. Alte Gesamtstatistiken bleiben erhalten. Noch ungesehene Fragen haben im Schwächen-Trainer Vorrang vor bereits sicheren.</p><div class="grid">${stats.map(x=>`<div class="card"><h3>${x.title}</h3><strong style="font-size:32px">${x.pct===null?'–':x.pct+'%'}</strong><p class="small">${x.seen}/${x.total} Fragen gesehen · ${x.tries} Antworten</p><div class="progress"><span style="width:${x.pct||0}%"></span></div><button onclick="current=2;renderNav();quizLimit=10;startQuiz('${x.t}')">Thema üben</button></div>`).join('')}</div><div class="card" style="margin-top:20px"><h3>Deine Merkliste</h3>${(state.bookmarks||[]).length?state.bookmarks.map(i=>`<details><summary>${esc(DATA.questions[i].q)}</summary><p>${esc(DATA.questions[i].a[0])} ${esc(DATA.questions[i].e)}</p><button onclick="toggleBookmark(${i});progressView()">Aus Merkliste entfernen</button></details>`).join(''):'<p>Mit „Frage merken“ im Quiz sammelst du hier schwierige Fragen.</p>'}<h3 style="margin-top:22px">Fortschritt mitnehmen</h3><p>Exportiere deinen Lernstand vor einem Gerätewechsel. Import stellt den gesicherten Stand wieder her und ersetzt den aktuellen.</p><div class="row"><button onclick="exportProgress()">Lernstand exportieren</button><label class="btn" style="cursor:pointer">Lernstand importieren<input id="importProgress" type="file" accept="application/json,.json" style="display:none"></label></div><p id="importFeedback" role="status"></p></div>`);$('#importProgress').onchange=importProgress}
function exportProgress(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'informatik-studio',version:2,state},null,2)],{type:'application/json'}));a.download='informatik-lernstand.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importProgress(e){try{let file=e.target.files[0];if(!file)return;if(file.size>10000000)throw Error('Datei ist zu groß.');let data=JSON.parse(await file.text()),v=data.state;const ids=(a,max)=>Array.isArray(a)&&a.every(x=>Number.isInteger(x)&&x>=0&&x<max);if(data.app!=='informatik-studio'||!v||!ids(v.done,8)||!ids(v.known,96)||!ids(v.wrong,96)||!ids(v.bookmarks||[],96)||!Number.isInteger(v.attempts)||v.attempts<0||!Number.isInteger(v.correct)||v.correct<0||v.correct>v.attempts||!v.notes||typeof v.notes!=='object'||Array.isArray(v.notes)||Object.values(v.notes).some(x=>typeof x!=='string'))throw Error('Das ist kein gültiger Lernstand.');let qs={};for(let [k,x]of Object.entries(v.qstats||{})){if(!/^\d+$/.test(k)||+k>=96||!Number.isInteger(x.tries)||x.tries<1||!Number.isInteger(x.hits)||x.hits<0||x.hits>x.tries)throw Error('Ungültige Statistik.');qs[k]={tries:x.tries,hits:x.hits}}if(!confirm('Den aktuellen Lernstand durch diese Sicherung ersetzen?'))return;state={done:v.done,known:v.known,wrong:v.wrong,bookmarks:v.bookmarks||[],attempts:v.attempts,correct:v.correct,notes:v.notes,qstats:qs,theme:v.theme==='light'?'light':'dark'};save();theme();progressView();$('#importFeedback').textContent='Lernstand importiert.'}catch(err){$('#importFeedback').textContent='Import fehlgeschlagen: '+err.message}}
const gaps=[

['Untergrenze','<input type="number" ___="0">','min','min setzt die kleinste erlaubte Zahl.'],

['Zahlenraten','Wenn Tipp ___ Geheimzahl:\n    Ausgabe "Zu klein"','<','Der Tipp ist kleiner als die Geheimzahl.'],

const orders=[
['Durchschnitt berechnen',['Zahlen einlesen','Summe der Zahlen bilden','Summe durch die Anzahl teilen','Durchschnitt ausgeben']],
['Kaffee ohne Süßung',['Größe abfragen und Becher wählen','Kaffeesorte wählen und zubereiten','Süßen abfragen: Nein','Zur Zahlung auffordern']],

['Kopfgesteuerte Zählschleife – erster Durchlauf',['i auf 0 setzen','Prüfen, ob i < 3','i um 1 erhöhen','i ausgeben','Zur Bedingungsprüfung zurückkehren']],
['Zahlenraten: erster Tipp ist zu klein',['Geheimzahl festlegen','Ersten Tipp lesen','Prüfen: Tipp ungleich Geheimzahl? Ja','Prüfen: Tipp kleiner als Geheimzahl? Ja','„Zu klein“ ausgeben','Neuen Tipp lesen']],
['Fußgesteuerte Schleife – erster Durchlauf',['Startwert festlegen','Schleifenkörper ausführen','Bedingung am Ende prüfen','Bei wahr zum Schleifenkörper zurückkehren']],
['Apfelsaft-Bestellung',['Anzahl der Kisten einlesen','Passenden Mengenbereich ermitteln','Stückpreis für diesen Bereich festlegen','Gesamtpreis = Anzahl · Stückpreis','Gesamtpreis ausgeben']],
['Top-down-Entwurf',['Gesamtproblem beschreiben','In Teilprobleme zerlegen','Teilprobleme in konkrete Schritte verfeinern','Ablauf als Diagramm darstellen und prüfen']]

let trainingMode='gap',gapDeck=shuffle(gaps.map((_,i)=>i)),gapPos=0,gapChecked=false,orderId=0,orderParts=[],orderFeedback='',simType='while',simFrames=[],simStep=0,simLoadedLimit=3;
function trainer(){show(`<div class="sectionhead"><div><div class="eyebrow">Selber denken, direkt prüfen</div><h2>Aktiv trainieren</h2></div></div><div class="row" style="margin-bottom:22px"><button onclick="trainingMode='gap';trainer()" class="${trainingMode==='gap'?'primary':''}">20 Lückencode-Aufgaben</button><button onclick="trainingMode='order';trainer()" class="${trainingMode==='order'?'primary':''}">8 Abläufe ordnen</button><button onclick="trainingMode='sim';trainer()" class="${trainingMode==='sim'?'primary':''}">Algorithmus Schritt für Schritt</button></div><div id="trainingBody"></div>`);if(trainingMode==='gap')gapView();if(trainingMode==='order'){if(!orderParts.length)newOrder();else orderView()}if(trainingMode==='sim')simView()}
function gapView(){let x=gaps[gapDeck[gapPos%gaps.length]];gapChecked=false;$('#trainingBody').innerHTML=`<div class="card narrow"><span class="pill">Lücke ${gapPos%gaps.length+1} / ${gaps.length}</span><h3 style="margin-top:18px">${esc(x[0])}</h3><p>Ersetze ___ durch genau den fehlenden Bestandteil.</p><pre>${esc(x[1])}</pre><label for="gapAnswer">Fehlender Code</label><input type="text" id="gapAnswer" autocomplete="off" spellcheck="false"><button class="primary" id="gapCheck">Prüfen</button><div id="gapFeedback" role="status"></div></div>`;$('#gapCheck').onclick=checkGap;$('#gapAnswer').onkeydown=e=>{if(e.key==='Enter')checkGap()}}
function checkGap(){if(gapChecked)return;let x=gaps[gapDeck[gapPos%gaps.length]],v=$('#gapAnswer').value.trim();if(!v){$('#gapFeedback').textContent='Trage zuerst eine Antwort ein.';return}gapChecked=true;let correct=v===x[2];$('#gapFeedback').innerHTML=`<div class="feedback"><strong>${correct?'Richtig.':'Die gesuchte Ergänzung ist: '+esc(x[2])}</strong><p>${esc(x[3])}</p><button onclick="gapPos++;if(gapPos%gaps.length===0)gapDeck=shuffle(gapDeck);gapView()">Nächste Lücke →</button></div>`}
function newOrder(){orderFeedback='';orderParts=shuffle(orders[orderId][1].map((_,i)=>i));if(orderParts.every((x,i)=>x===i))orderParts.push(orderParts.shift());orderView()}
function orderView(){let x=orders[orderId];$('#trainingBody').innerHTML=`<div class="card narrow"><label for="orderSelect">Ablauf wählen</label><select id="orderSelect">${orders.map((x,i)=>`<option value="${i}" ${i===orderId?'selected':''}>${esc(x[0])}</option>`).join('')}</select><p style="margin-top:18px">Bringe die Schritte mit den Pfeilen in die richtige Reihenfolge.</p>${orderParts.map((part,i)=>`<div class="row" style="padding:12px 0;border-top:1px solid var(--line);flex-wrap:nowrap"><span class="small">${i+1}.</span><span style="flex:1">${esc(x[1][part])}</span><button aria-label="Schritt ${i+1} nach oben" ${i===0?'disabled':''} onclick="movePart(${i},-1)">↑</button><button aria-label="Schritt ${i+1} nach unten" ${i===orderParts.length-1?'disabled':''} onclick="movePart(${i},1)">↓</button></div>`).join('')}<div class="row"><button class="primary" onclick="checkOrder()">Reihenfolge prüfen</button><button onclick="newOrder()">Neu mischen</button></div><div id="orderFeedback" role="status">${orderFeedback}</div></div>`;$('#orderSelect').onchange=e=>{orderId=+e.target.value;newOrder()}}
function movePart(i,delta){let j=i+delta;if(j<0||j>=orderParts.length)return;[orderParts[i],orderParts[j]]=[orderParts[j],orderParts[i]];orderFeedback='';orderView()}
function checkOrder(){let n=orderParts.filter((x,i)=>x===i).length;orderFeedback=`<div class="feedback"><strong>${n===orderParts.length?'Alles richtig angeordnet.':n+' von '+orderParts.length+' Schritten stehen schon richtig.'}</strong>${n===orderParts.length?'':'<details><summary>Lösung ansehen</summary><ol>'+orders[orderId][1].map(t=>'<li>'+esc(t)+'</li>').join('')+'</ol></details>'}</div>`;$('#orderFeedback').innerHTML=orderFeedback}
function makeFrames(type,start,limit){let out=[],frames=[],i=start,sum=0;const f=(line,note)=>frames.push({line,note,i,sum,out:[...out]});f(0,'Startwert setzen.');if(type==='sum'){for(let n=1;n<=limit;n++){i=n;f(1,'Nächste Zahl: '+i);sum+=i;f(2,'Diese Zahl zur bisherigen Summe addieren.')}out=[sum];f(3,'Fertige Summe ausgeben.')}else if(type==='while'){while(true){f(1,`${i} < ${limit} ist ${i<limit?'wahr: Körper ausführen.':'falsch: Schleife verlassen.'}`);if(i>=limit)break;i++;f(2,'i um 1 erhöhen.');out.push(i);f(3,'Aktuellen Wert ausgeben.')}f(4,'Ende.')}else{do{i++;f(1,'Körper beginnt ohne vorherige Prüfung: i erhöhen.');out.push(i);f(2,'Aktuellen Wert ausgeben.');f(3,`${i} < ${limit} ist ${i<limit?'wahr: erneut ausführen.':'falsch: beenden.'}`)}while(i<limit);f(4,'Ende.')}return frames}
function simView(){simFrames=[];simStep=0;$('#trainingBody').innerHTML=`<div class="card"><div class="row"><div><label for="simType">Algorithmus</label><select id="simType"><option value="while">Kopfgesteuerte Schleife</option><option value="do">Fußgesteuerte Schleife</option><option value="sum">Summe von 1 bis n</option></select></div><div><label for="simStart">Startwert i (0–8)</label><input id="simStart" type="number" min="0" max="8" value="0"></div><div><label for="simLimit">Grenze / n (1–8)</label><input id="simLimit" type="number" min="1" max="8" value="3"></div><button class="primary" onclick="resetSim()">Ablauf laden</button></div><p class="small">Tipp: Vergleiche Startwert 5 und Grenze 3 bei Kopf- und Fußsteuerung. Bei der Summe startet die Zählung immer bei 1.</p><div id="simOutput" aria-live="polite"></div></div>`;$('#simType').value=simType;$('#simType').onchange=e=>{simType=e.target.value;$('#simStart').disabled=simType==='sum';resetSim()};resetSim()}
function resetSim(){let st=+$('#simStart').value,l=+$('#simLimit').value;simType=$('#simType').value;if(!Number.isInteger(st)||st<0||st>8||!Number.isInteger(l)||l<1||l>8){$('#simOutput').textContent='Bitte ganze Zahlen in den angegebenen Grenzen eintragen.';return}simLoadedLimit=l;simFrames=makeFrames(simType,simType==='sum'?0:st,l);simStep=0;renderSim()}
function renderSim(){let f=simFrames[simStep],limit=simLoadedLimit;let code=simType==='sum'?['summe = 0','Für i von 1 bis '+limit,'    summe = summe + i','Ausgabe summe']:simType==='while'?['i = '+simFrames[0].i,'Solange i < '+limit+':','    i = i + 1','    Ausgabe i','Ende']:['i = '+simFrames[0].i,'Wiederhole: i = i + 1','    Ausgabe i','Solange i < '+limit,'Ende'];$('#simOutput').innerHTML=`<div class="split"><div style="margin:16px 0;font-family:monospace">${code.map((l,n)=>`<div style="padding:10px 12px;white-space:pre-wrap;border-radius:6px;${n===f.line?'background:var(--accent);color:var(--ink)':'color:var(--muted)'}">${n+1}  ${esc(l)}</div>`).join('')}</div><div class="feedback"><span class="pill">Schritt ${simStep+1} / ${simFrames.length}</span><p style="margin-top:16px">${esc(f.note)}</p><strong>i = ${f.i}${simType==='sum'?' · summe = '+f.sum:''}</strong><p>Ausgabe: ${f.out.length?f.out.join(', '):'noch keine'}</p></div></div><div class="row"><button ${simStep===0?'disabled':''} onclick="simStep--;renderSim()">← Zurück</button><button class="primary" ${simStep===simFrames.length-1?'disabled':''} onclick="simStep++;renderSim()">Nächster Schritt →</button><button onclick="simStep=0;renderSim()">Von vorne</button></div>`}

nav(0);save();
</script></body></html>
